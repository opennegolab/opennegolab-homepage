<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1학년 배움터</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#F6F3EC; --surface:#FFFFFF; --ink:#2B2B33; --ink-soft:#7A7A86; --line:#ECE7DC;
    --brand:#3B4A7A; --brand-soft:#EEF1F8; --accent:#E8755A; --good:#3FAE8C; --wrong:#E8755A; --gold:#E0A93B;
    --radius:18px;
    --shadow:0 1px 2px rgba(43,43,51,.04), 0 8px 24px rgba(43,43,51,.06);
    --shadow-sm:0 1px 2px rgba(43,43,51,.05), 0 3px 10px rgba(43,43,51,.05);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); }
  body {
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink);
    height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center;
    padding:12px 14px; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ width:100%; max-width:460px; height:100%; display:flex; flex-direction:column; }
  header{ text-align:center; margin-bottom:10px; flex:none; }
  .kicker{ font-size:.66rem; letter-spacing:.2em; color:var(--ink-soft); font-weight:600; }
  h1 { font-size:1.2rem; font-weight:800; color:var(--ink); margin-top:2px; letter-spacing:-.01em; }

  .subjects { display:flex; gap:5px; background:var(--surface); padding:5px; border-radius:12px;
    box-shadow:var(--shadow-sm); margin-bottom:10px; overflow-x:auto; flex:none; }
  .subj { flex:1 0 auto; padding:8px 11px; border:none; border-radius:9px; background:transparent;
    color:var(--ink-soft); font-family:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
    white-space:nowrap; transition:background .18s,color .18s; }
  .subj.active { background:var(--brand); color:#fff; }

  .levelbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex:none; }
  .levels { display:flex; gap:5px; }
  .lv { width:30px; height:30px; border:1.5px solid var(--line); border-radius:8px; background:var(--surface);
    color:var(--ink-soft); font-family:inherit; font-size:.88rem; font-weight:700; cursor:pointer; transition:all .18s; }
  .lv.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .lv-label { font-size:.78rem; color:var(--ink-soft); font-weight:600; margin-bottom:8px; flex:none; }

  .progress{ display:flex; gap:4px; margin-bottom:10px; flex:none; }
  .dot{ flex:1; height:4px; border-radius:99px; background:var(--line); transition:background .2s; }
  .dot.done{ background:var(--brand); }
  .dot.current{ background:var(--accent); }

  /* 카드: 남은 공간을 채우고 내부만 스크롤 */
  .card { background:var(--surface); border-radius:var(--radius); padding:18px 18px; box-shadow:var(--shadow);
    text-align:center; flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; justify-content:safe center; }
  .emoji { font-size:2.6rem; margin-bottom:8px; display:block; }
  .big { font-size:1.7rem; font-weight:800; color:var(--ink); line-height:1.25; margin-bottom:4px; letter-spacing:-.01em; }
  .story { font-size:1.06rem; color:var(--ink); line-height:1.55; margin-bottom:10px; text-align:left;
    background:var(--bg); padding:13px 14px; border-radius:12px; border:1px solid var(--line); }
  .meaning { font-size:1rem; color:var(--ink-soft); margin-bottom:12px; }
  .question { font-size:1.04rem; color:var(--brand); font-weight:700; margin:10px 0; }

  .btn { border:none; border-radius:11px; padding:12px; font-family:inherit; font-size:1rem;
    font-weight:700; color:#fff; width:100%; cursor:pointer; transition:transform .08s,filter .15s; }
  .btn:active { transform:translateY(1px); }
  .btns { display:flex; flex-direction:column; gap:8px; }
  .listen { background:var(--brand); }
  .speak { background:var(--accent); }
  .next-btn{ background:var(--ink); margin-top:10px; }

  .options { display:flex; flex-direction:column; gap:7px; margin-top:4px; }
  .opt { border:1.5px solid var(--line); border-radius:11px; padding:12px; font-family:inherit;
    font-size:1.08rem; font-weight:600; background:var(--surface); color:var(--ink); cursor:pointer;
    transition:border-color .15s,background .15s; text-align:center; }
  .opt:hover{ border-color:var(--brand); }
  .opt:active { background:var(--brand-soft); }

  .answer-box { font-size:1.7rem; font-weight:800; color:var(--brand); min-height:40px; margin:4px 0 10px; letter-spacing:.02em; }
  .numpad { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .numpad button { border:1.5px solid var(--line); border-radius:11px; padding:10px; font-family:inherit;
    font-size:1.2rem; font-weight:700; background:var(--surface); color:var(--ink); cursor:pointer; transition:background .12s; }
  .numpad button:active { background:var(--brand-soft); }
  .numpad .ok{ background:var(--brand); border-color:var(--brand); color:#fff; }

  .result { margin-top:10px; font-size:1rem; font-weight:700; min-height:24px; line-height:1.35; }
  .good { color:var(--good); }
  .again { color:var(--accent); }
  .hint { font-size:.76rem; color:var(--ink-soft); margin-top:10px; }
  .clock { margin:0 auto 8px; display:block; width:140px; height:140px; }

  .score-num{ font-size:2.2rem; font-weight:800; color:var(--ink); }
  .review-head{ font-weight:700; color:var(--accent); margin:10px 0 8px; text-align:left; font-size:.9rem; letter-spacing:.02em; }
  .review{ text-align:left; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin-bottom:7px; }
  .review .q{ font-weight:700; color:var(--ink); font-size:.94rem; }
  .review .a{ color:var(--good); font-weight:700; margin-top:4px; font-size:.9rem; }
  .review .e{ color:var(--ink-soft); font-size:.86rem; margin-top:4px; line-height:1.45; }

  /* 시작 화면 */
  .start{ height:100%; display:flex; flex-direction:column; }
  .start-card{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:28px 22px; text-align:center; margin-top:8px; display:flex; flex-direction:column; }
  .start-emoji{ font-size:3.4rem; margin-bottom:10px; }
  .start-title{ font-size:1.2rem; font-weight:800; color:var(--ink); margin-bottom:16px; }
  .name-input{ font-family:inherit; font-size:1.2rem; font-weight:700; text-align:center; color:var(--ink);
    padding:14px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); width:100%; }
  .name-input:focus{ outline:none; border-color:var(--brand); }
  .saved-names{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:16px; }
  .saved-name{ display:inline-flex; align-items:center; gap:6px; background:var(--brand-soft); color:var(--brand);
    border:none; border-radius:999px; padding:8px 14px; font-family:inherit; font-size:.95rem; font-weight:700; cursor:pointer; }
  .saved-name .del{ color:var(--ink-soft); font-weight:700; font-size:1rem; line-height:1; }

  /* 상단바 (학습자 이름 + 랭킹) */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex:none; }
  .topbtn{ border:none; background:var(--surface); box-shadow:var(--shadow-sm); width:38px; height:38px;
    border-radius:10px; font-size:1.15rem; cursor:pointer; color:var(--ink); }
  .topbtn:active{ transform:translateY(1px); }
  .learner{ font-size:1.05rem; font-weight:800; color:var(--ink); }

  /* 랭킹 */
  .rank-row{ display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:11px;
    background:var(--bg); border:1px solid var(--line); margin-bottom:7px; text-align:left; }
  .rank-row.me{ background:var(--brand-soft); border-color:var(--brand); }
  .rank-medal{ font-size:1.2rem; width:30px; text-align:center; flex:none; }
  .rank-name{ font-weight:700; color:var(--ink); flex:1; }
  .rank-score{ font-weight:800; color:var(--brand); }
  .rank-empty{ color:var(--ink-soft); font-size:.95rem; padding:18px 0; }
  .rank-tabs{ display:flex; gap:5px; flex-wrap:wrap; justify-content:center; margin-bottom:12px; }
  .rank-tab{ border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft);
    border-radius:9px; padding:7px 11px; font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; }
  .rank-tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

  /* 세로가 짧은 화면: 숫자패드·여백 더 압축 */
  @media (max-height:640px){
    .emoji{ font-size:2.2rem; margin-bottom:5px; }
    .big{ font-size:1.5rem; }
    .numpad{ gap:5px; }
    .numpad button{ padding:9px; font-size:1.1rem; }
    .card{ padding:14px; }
    .story{ font-size:.98rem; padding:9px 11px; line-height:1.38; margin-bottom:8px; }
    .question{ margin:8px 0; font-size:1rem; }
    .meaning{ margin-bottom:8px; }
    .opt{ padding:10px; font-size:1.02rem; }
    .options{ gap:6px; }
    .btn{ padding:10px; }
    .btns{ gap:6px; }
    .hint{ margin-top:7px; }
  }
  @media (max-height:560px){
    .emoji{ font-size:1.8rem; margin-bottom:3px; }
    .story{ font-size:.92rem; }
    .numpad button{ padding:7px; font-size:1rem; }
    .opt{ padding:8px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- 시작 화면 -->
    <div id="startScreen" class="start">
      <header>
        <div class="kicker">초등 1학년</div>
        <h1>배움터</h1>
      </header>
      <div class="start-card">
        <div class="start-emoji">🎒</div>
        <div class="start-title">이름을 적어 주세요</div>
        <input id="nameInput" class="name-input" type="text" maxlength="10" placeholder="이름" autocomplete="off">
        <button id="startBtn" class="btn listen" style="margin-top:12px">학습 시작</button>
        <div id="savedNames" class="saved-names"></div>
      </div>
    </div>

    <!-- 학습 화면 -->
    <div id="learnScreen" style="display:none; height:100%; flex-direction:column;">
      <div class="topbar">
        <button id="homeBtn" class="topbtn" title="처음으로">↩</button>
        <div class="learner" id="learnerName"></div>
        <button id="rankBtn" class="topbtn" title="랭킹">🏆</button>
      </div>
      <div class="subjects" id="subjects"></div>
      <div class="levelbar"><div class="levels" id="levels"></div></div>
      <div class="lv-label" id="lvLabel"></div>
      <div class="progress" id="progress"></div>
      <div class="card" id="card"></div>
    </div>
  </div>



<script>

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffleOpts(correct, wrongs){ const all=[correct,...wrongs]; for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; } return all; }

  while(set.size<3 && guard<100){ set.add(genWrong()); guard++; }
  const arr=[...set];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function shuffleArr(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// 시각을 "○시" 또는 "○시 ○분"으로 표시
function fmtTime(h,m){ return m===0 ? h+"시" : h+"시 "+m+"분"; }

/* ============ 퀴즈 엔진 ============ */
const SET_SIZE = 10;   // 한 챕터(세트) 문제 수

let qi = 0;             // 현재 문제 번호

// 단계 진입 시 세트 구성
function buildQuiz(){
  const subj = SUBJECTS[subjKey];
  const lv = subj.levels[level];
  quiz = [];
  if(subj.type==='reading' || subj.type==='speak'){
    // 보유 문제에서 섞어 SET_SIZE개 뽑기
    let pool = shuffleArr(lv.items);
    if(pool.length < SET_SIZE){ // 모자라면 반복 채움
      while(pool.length < SET_SIZE) pool = pool.concat(shuffleArr(lv.items));
    }
    pool = pool.slice(0, SET_SIZE);
    if(subj.type==='reading'){
      quiz = pool.map(it=>{
        const order = shuffleArr(it.opts.map((o,i)=>i));
        return { kind:'reading', story:it.story, q:it.q, exp:it.exp,
                 opts:order.map(i=>it.opts[i]), a:order.indexOf(it.a) };
      });
    } else {
      quiz = pool.map(it=>({ kind:'speak', s:it.s, m:it.m, e:it.e, exp:it.exp }));
    }
  } else {
    // 산수/시계/돈: gen()으로 SET_SIZE개 생성
    for(let i=0;i<SET_SIZE;i++){
      const g = lv.gen();
      g.kind = subj.type;
      quiz.push(g);
    }
  }
  qi = 0;
  answers = new Array(SET_SIZE).fill(null);
}

function renderProgress(){
  const p=document.getElementById('progress');
  let h='';
  for(let i=0;i<SET_SIZE;i++){
    const cls = i<qi ? 'dot done' : (i===qi ? 'dot current' : 'dot');
    h+=`<span class="${cls}"></span>`;
  }
  p.innerHTML=h;
}
function render(){
  const lv = SUBJECTS[subjKey].levels[level];
  document.getElementById('lvLabel').textContent = (lv.desc||lv.name)+' · '+(qi+1)+'/'+SET_SIZE+'문제';
  if(!quiz.length) buildQuiz();
  renderProgress();
  const item = quiz[qi];
  if(item.kind==='reading') renderReading(item);
  else if(item.kind==='math') renderMath(item);
  else if(item.kind==='clock') renderClock(item);
  else if(item.kind==='speak') renderSpeak(item);
  else if(item.kind==='money') renderMoney(item);
}

// 답 기록 후 다음으로 (정답/오답 표시 없이 바로 진행)

function renderClock(item){

    <div class="hint">답을 누르면 다음 문제로 넘어가요!</div>`;
}
function clockSVG(h,m,size){
  size = size || 170;
  const hourAngle=(h%12)*30 + m*0.5;
  const minAngle=m*6;
  // 각도(12시=0도, 시계방향)에서 끝점 좌표 계산
  const pt=(deg,len)=>{ const rad=(deg-90)*Math.PI/180; return { x:80+len*Math.cos(rad), y:80+len*Math.sin(rad) }; };
  const he=pt(hourAngle,40);   // 시침 끝 (짧게)
  const me=pt(minAngle,60);    // 분침 끝 (길게)
  let ticks='';
  for(let i=1;i<=12;i++){ const rad=(i*30-90)*Math.PI/180; const x=80+62*Math.cos(rad),y=80+62*Math.sin(rad); ticks+=`<text x="${x}" y="${y+5}" font-size="13" text-anchor="middle" fill="#9A958A" font-weight="700">${i}</text>`; }
  return `<svg class="clock" width="${size}" height="${size}" viewBox="0 0 160 160" style="margin:0">
    <circle cx="80" cy="80" r="74" fill="#FFFFFF" stroke="var(--gold)" stroke-width="3"/>
    ${ticks}
    <line x1="80" y1="80" x2="${me.x}" y2="${me.y}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="${he.x}" y2="${he.y}" stroke="var(--brand)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="4.5" fill="var(--ink)"/>
  </svg>`;
}

/* ============ 채점 ============ */
function isCorrect(item, ans){
  if(item.kind==='reading') return ans===item.a;
  if(item.kind==='math') return ans===item.a;
  if(item.kind==='money') return ans===item.a;
  if(item.kind==='clock') return ans===item.ans;
  if(item.kind==='speak') return ans===true;   // 말하기 성공 여부
  return false;
}
function showResult(){
  let correct=0;
  const wrong=[];
  quiz.forEach((item,i)=>{
    if(isCorrect(item, answers[i])) correct++;
    else wrong.push({item, ans:answers[i], no:i+1});
  });
  const score=Math.round(correct/SET_SIZE*100);
  recordScore(subjKey, level, correct, SET_SIZE);   // 랭킹 기록
  let face = score===100?'🏆': score>=70?'😄': score>=40?'🙂':'💪';
  let msg  = score===100?'모두 맞았어요! 최고예요!': score>=70?'아주 잘했어요!': score>=40?'잘하고 있어요!':'다시 한 번 해볼까요?';

  let html=`<span class="emoji">${face}</span>
    <div class="score-num">${correct} / ${SET_SIZE}</div>
    <div class="meaning">${msg}</div>`;

  if(wrong.length){
    html+=`<div class="review-head">다시 볼 문제 ${wrong.length}개</div>`;
    wrong.forEach(w=>{
      const it=w.item;
      let qtext, correctText, expText, extra='';
      if(it.kind==='reading'){ qtext=it.q; correctText=it.opts[it.a]; expText=it.exp; }
      else if(it.kind==='speak'){ qtext=it.s+' ('+it.m+')'; correctText='따라 말하기'; expText=it.exp; }
      else if(it.kind==='clock'){ qtext=it.q; correctText=it.ans; expText="정답 시각의 시계예요. 바늘 위치를 살펴봐요."; extra=`<div style="margin-top:8px;display:flex;justify-content:center">${clockSVG(it.h,it.m,90)}</div>`; }
      else if(it.kind==='math'){ qtext=it.big; correctText=it.a+''; expText="천천히 다시 세어 보면 답을 찾을 수 있어요."; }
      else if(it.kind==='money'){ qtext=(it.label||((it.line1||'')+' / '+(it.line2||''))); correctText=it.a.toLocaleString()+'원'; expText="동전과 지폐를 하나씩 더해 보세요."; }
      html+=`<div class="review">
        <div class="q">${w.no}. ${qtext}</div>
        <div class="a">정답 · ${correctText}</div>
        <div class="e">${expText}</div>
        ${extra}
      </div>`;
    });
  }

  const lastLevel = SUBJECTS[subjKey].levels.length - 1;
  if(level < lastLevel){
    html+=`<button class="btn next-btn" style="margin-top:16px" onclick="goNextLevel()">다음 단계로 ▶</button>`;
    html+=`<button class="btn listen" style="margin-top:8px" onclick="restartQuiz()">다시 풀기</button>`;
  } else {
    html+=`<div style="margin-top:14px;font-weight:700;color:var(--good)">🎊 마지막 단계까지 모두 끝냈어요!</div>`;
    html+=`<button class="btn next-btn" style="margin-top:12px" onclick="goLevel(0)">처음 단계로</button>`;
    html+=`<button class="btn listen" style="margin-top:8px" onclick="restartQuiz()">다시 풀기</button>`;
  }
  html+=`<button class="btn" style="background:var(--gold);margin-top:8px" onclick="rankView={subj:subjKey,lv:level};showRanking()">🏆 랭킹 보기</button>`;
  document.getElementById('card').innerHTML=html;
  document.getElementById('progress').innerHTML='';
  document.getElementById('lvLabel').textContent=(SUBJECTS[subjKey].levels[level].desc||'')+' · 채점 완료';
}
function goLevel(i){
  level=i; quiz=[];
  document.querySelectorAll('.lv').forEach((x,xi)=>x.classList.toggle('active', xi===level));
  render();
}
function goNextLevel(){
  const lastLevel = SUBJECTS[subjKey].levels.length - 1;
  if(level < lastLevel) goLevel(level+1);
}

/* ============ 음성 ============ */
function speakKo(t){ const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); }
function readStory(){
  const item=quiz[qi];
  speechSynthesis.cancel();
  const u1=new SpeechSynthesisUtterance(item.story); u1.lang='ko-KR'; u1.rate=0.85;
  const u2=new SpeechSynthesisUtterance(item.q); u2.lang='ko-KR'; u2.rate=0.85;
  speechSynthesis.speak(u1); speechSynthesis.speak(u2);
}
function speakEn(t){ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=0.72; speechSynthesis.cancel(); speechSynthesis.speak(u); }

function clean(t){ return t.toLowerCase().replace(/[.,!?'"]/g,'').replace(/\s+/g,' ').trim(); }

// 마이크 스트림을 한 번만 요청하고 보관 (권한 팝업 1회)
function getMic(){
  if(micStream) return Promise.resolve(micStream);
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))
    return Promise.reject('unsupported');
  return navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{ micStream=s; return s; });
}

function toggleRec(){
  const res=document.getElementById('result');
  const btn=document.getElementById('recBtn');
  if(isRecording){ stopRec(); return; }   // 녹음 중이면 멈춤
  if(!window.MediaRecorder){ res.textContent='😢 크롬(Chrome) 앱에서 열어주세요!'; res.className='result again'; return; }

  getMic().then(stream=>{
    let chunks=[];
    try{
      mediaRec=new MediaRecorder(stream);
    }catch(e){ res.textContent='😅 녹음을 시작할 수 없어요. 다시 눌러보세요.'; res.className='result again'; return; }
    mediaRec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); };
    mediaRec.onstop=()=>{
      isRecording=false;
      if(btn) btn.textContent='🎙️ 따라 말하기';
      if(chunks.length){
        if(myVoiceUrl) URL.revokeObjectURL(myVoiceUrl);
        myVoiceUrl=URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType||'audio/webm'}));
        speakScore=true;   // 녹음을 했으면 칭찬
        const pm=document.getElementById('playMine'); if(pm) pm.style.display='block';
        res.textContent='🎉 잘했어요! 내 목소리를 들어볼까요?'; res.className='result good';
      } else {
        res.textContent='🔇 소리가 녹음되지 않았어요. 다시 해볼까요?'; res.className='result again';
      }
    };
    mediaRec.start();
    isRecording=true;
    if(btn) btn.textContent='⏹️ 멈추기';
    res.textContent='🎧 녹음 중이에요... 또박또박 말해요!'; res.className='result';
  }).catch(err=>{
    if(err==='unsupported') res.textContent='😢 이 브라우저는 녹음을 지원하지 않아요. 크롬을 써보세요!';
    else res.textContent='🎤 마이크 권한이 필요해요. 주소창 왼쪽 자물쇠 → 마이크 → 허용으로 바꿔주세요!';
    res.className='result again';
  });
}

function stopRec(){
  if(mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); }
}

function playMyVoice(){
  if(!myVoiceUrl) return;
  const a=new Audio(myVoiceUrl);
  a.play();
}


/* ============ 저장소 (기기 저장; 나중에 클라우드로 교체 가능) ============ */
const STORE_KEY='baeumteo_v1';
function loadStore(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {names:[], ranks:{}}; }
  catch(e){ return {names:[], ranks:{}}; }   // 저장 불가 환경이면 메모리만
}
function saveStore(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){ /* 무시 */ }
}
let store = loadStore();
let learner = '';

// 랭킹 키: 과목|단계  →  [{name, score, ts}]
function rankKey(subj, lv){ return subj+'|'+lv; }
function recordScore(subj, lv, correct, total){
  const score=Math.round(correct/total*100);
  const key=rankKey(subj, lv);
  if(!store.ranks[key]) store.ranks[key]=[];
  const list=store.ranks[key];
  const mine=list.find(r=>r.name===learner);
  if(mine){ if(score>mine.score){ mine.score=score; mine.ts=Date.now(); } }
  else { list.push({name:learner, score, ts:Date.now()}); }
  // 정렬: 점수 높은 순, 같으면 먼저 달성한 순
  list.sort((a,b)=> b.score-a.score || a.ts-b.ts);
  saveStore(store);
}

/* ============ 시작 화면 ============ */
function renderStart(){
  document.getElementById('startScreen').style.display='flex';
  document.getElementById('learnScreen').style.display='none';
  const sn=document.getElementById('savedNames');
  sn.innerHTML='';
  if(store.names.length){
    store.names.forEach(n=>{
      const b=document.createElement('span');
      b.className='saved-name';
      b.innerHTML=`<span class="pick">${n}</span> <span class="del">✕</span>`;
      b.querySelector('.pick').onclick=()=>startLearning(n);
      b.querySelector('.del').onclick=(e)=>{ e.stopPropagation(); store.names=store.names.filter(x=>x!==n); saveStore(store); renderStart(); };
      sn.appendChild(b);
    });
  }
}
function startLearning(name){
  name=(name||'').trim();
  if(!name){ const inp=document.getElementById('nameInput'); inp.focus(); inp.style.borderColor='var(--accent)'; return; }
  learner=name;
  if(!store.names.includes(name)){ store.names.unshift(name); store.names=store.names.slice(0,8); saveStore(store); }
  document.getElementById('learnerName').textContent=name+' 님';
  document.getElementById('startScreen').style.display='none';
  document.getElementById('learnScreen').style.display='flex';
  subjKey=Object.keys(SUBJECTS)[0]; level=0; quiz=[];
  document.querySelectorAll('.subj').forEach(s=>s.classList.toggle('active', s.textContent===subjKey));
  renderLevels(); render();
}

let rankView={subj:Object.keys(SUBJECTS)[0], lv:0};
function showRanking(){
  speechSynthesis.cancel();
  const subj=rankView.subj, lv=rankView.lv;
  const list=(store.ranks[rankKey(subj,lv)]||[]).slice(0,10);
  const subjBtns=Object.keys(SUBJECTS).map(k=>`<button class="rank-tab${k===subj?' active':''}" onclick="setRankSubj('${k}')">${k}</button>`).join('');
  const lvBtns=SUBJECTS[subj].levels.map((L,i)=>`<button class="rank-tab${i===lv?' active':''}" onclick="setRankLv(${i})">${i+1}단계</button>`).join('');
  const medals=['🥇','🥈','🥉'];
  let rows;
  if(list.length){
    rows=list.map((r,i)=>`<div class="rank-row${r.name===learner?' me':''}">
      <span class="rank-medal">${medals[i]||(i+1)}</span>
      <span class="rank-name">${r.name}</span>
      <span class="rank-score">${r.score}점</span>
    </div>`).join('');
  } else {
    rows=`<div class="rank-empty">아직 기록이 없어요. 먼저 풀어 볼까요?</div>`;
  }
  document.getElementById('card').innerHTML=`
    <div style="font-size:1.3rem;font-weight:800;margin-bottom:12px">🏆 랭킹</div>
    <div class="rank-tabs">${subjBtns}</div>
    <div class="rank-tabs">${lvBtns}</div>
    <div style="margin-top:4px">${rows}</div>
    <button class="btn next-btn" onclick="exitRanking()">학습으로 돌아가기</button>`;
  // 학습 화면 위쪽 요소 숨김 (랭킹 볼 때)
  document.getElementById('subjects').style.display='none';
  document.querySelector('.levelbar').style.display='none';
  document.getElementById('lvLabel').style.display='none';
  document.getElementById('progress').style.display='none';
}
function setRankSubj(k){ rankView.subj=k; rankView.lv=0; showRanking(); }
function setRankLv(i){ rankView.lv=i; showRanking(); }
function exitRanking(){
  document.getElementById('subjects').style.display='';
  document.querySelector('.levelbar').style.display='';
  document.getElementById('lvLabel').style.display='';
  document.getElementById('progress').style.display='';
  quiz=[]; render();
}

/* ============ 버튼 연결 ============ */
document.getElementById('startBtn').onclick=()=>startLearning(document.getElementById('nameInput').value);
document.getElementById('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') startLearning(e.target.value); });
document.getElementById('homeBtn').onclick=()=>{ speechSynthesis.cancel(); if(mediaRec&&mediaRec.state==='recording'){try{mediaRec.stop();}catch(e){}} renderStart(); };
document.getElementById('rankBtn').onclick=()=>{ rankView={subj:subjKey, lv:level}; showRanking(); };

/* ============ 시작 ============ */
renderStart();
</script>
</body>
</html>
