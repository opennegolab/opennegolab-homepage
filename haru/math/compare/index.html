<!doctype html>
<html lang="ko" data-haru>
<head>
  <meta charset="utf-8">
  <script src="/haru/external-browser.js?v=2"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="하루와 함께 길이·높이·크기·무게·개수·수를 비교해 보세요.">
  <link rel="canonical" href="https://www.opennegolab.com/haru/math/compare">
  <meta property="og:type" content="website">
  <meta property="og:title" content="비교하기 | 하루랑">
  <meta property="og:description" content="길이·높이·크기·무게·개수·수를 그림으로 비교해 보세요.">
  <meta property="og:url" content="https://www.opennegolab.com/haru/math/compare">
  <meta property="og:image" content="https://www.opennegolab.com/haru/assets/share.png?v=2">
  <meta name="theme-color" content="#fff8e9">
  <title>비교하기 | 하루랑</title>
  <link rel="icon" href="/haru/assets/favicon.png">
  <link rel="manifest" href="/haru/manifest.webmanifest">
  <link rel="stylesheet" href="/haru/brand.css?v=4">
  <link rel="stylesheet" href="/typing/learn/style.css?v=26">
  <style>
    #compare-app { max-width: 900px; }
    .compare-menu .photo-card, .compare-option { background: white; }
    .compare-pic { display: flex; align-items: flex-end; justify-content: center; gap: .4rem; width: 100%; padding: .6rem; background: #f7f3ea; }
    .compare-pic svg { flex: 1; min-width: 0; height: auto; max-height: 150px; }
    .compare-menu .compare-pic { aspect-ratio: 16 / 9; align-items: center; }
    .compare-menu .compare-pic svg { max-height: 100%; }
    .compare-menu .card-copy { gap: .15rem; }
    .compare-menu .card-copy strong { font-size: clamp(1rem, 2.5vw, 1.25rem); }
    .compare-menu .card-copy small { font-size: clamp(.8rem, 2vw, .95rem); word-break: keep-all; }
    .compare-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .compare-option .compare-pic { aspect-ratio: 4 / 3; }
    .compare-option .compare-pic svg { max-height: none; height: 100%; }
    .kind-length .compare-pic { aspect-ratio: 2 / 1; align-items: center; }
    .compare-option .card-copy { font-weight: 800; font-size: clamp(1rem, 2.6vw, 1.2rem); justify-content: center; text-align: center; }
    .compare-option .card-copy:empty { display: none; }
    .compare-option.right { border: 3px solid var(--haru-green, #24543c); }
    .compare-option.right .compare-pic { background: #e6efdd; }
    .compare-option.wrong { animation: compare-shake .4s; border-color: #d98b8b; }
    .compare-option:disabled { cursor: default; opacity: 1; color: inherit; }
    .compare-scene { display: grid; place-items: center; margin-bottom: 1rem; padding: .6rem; border-radius: 1rem; background: #f7f3ea; }
    .compare-scene svg { width: min(100%, 420px); height: auto; }
    .compare-progress { margin: 0 0 .2rem; font-weight: 800; color: var(--haru-muted, #526456); font-size: .95rem; }
    .compare-done { display: grid; gap: .35rem; padding: 1.2rem; border-radius: 1rem; background: #fffbea; border: 2px solid #f0d27a; }
    .compare-done strong { font-size: 1.3rem; }
    .compare-done span { color: var(--haru-muted, #526456); font-weight: 700; }
    #compare-app button:disabled { cursor: default; }
    @keyframes compare-shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .compare-option.wrong { animation: none; } }
  </style>
  <script src="/haru/rewards.js?v=4"></script>
  <script type="module" src="/haru/math/compare/app.js?v=2"></script>
</head>
<body>
  <header class="haru-top">
    <div class="haru-top-inner">
      <a class="haru-return" href="/haru" aria-label="하루랑 처음으로"><img src="/haru/assets/logo.png" width="123" height="44" alt="하루랑"></a>
      <button type="button" id="compare-back" hidden>이전 단계</button>
      <a class="haru-return haru-top-action" href="/haru/math">수학으로</a>
    </div>
  </header>
  <main id="compare-app"></main>
  <p id="voice-status" role="status" hidden></p>
  <noscript>비교하기를 하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
