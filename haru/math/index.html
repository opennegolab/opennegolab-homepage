  <style>
    #math-menu { max-width: 960px; }
    .math-menu .photo-card img { aspect-ratio: 16 / 9; object-fit: cover; }
    .math-menu .card-copy { gap: .15rem; }
    .math-menu .card-copy strong { font-size: clamp(1.05rem, 2.6vw, 1.3rem); }
    .math-menu .card-copy small { font-size: clamp(.85rem, 2vw, 1rem); word-break: keep-all; }
    .math-menu a.photo-card { text-decoration: none; color: inherit; }
    @media (max-width: 640px) { .math-menu { grid-template-columns: 1fr; } .math-menu .photo-card img { aspect-ratio: auto; height: clamp(120px, 38vw, 190px); } }
  </style>

<body>
  <header class="haru-top">
    <nav class="haru-top-inner" aria-label="하루랑">
      <a class="haru-return" href="/haru" aria-label="하루랑 처음으로"><img src="/haru/assets/logo.png" width="123" height="44" alt="하루랑"></a>
      <a class="haru-return haru-top-action" href="/haru">처음으로</a>
    </nav>
  </header>
  <main id="math-menu">

    </header>
    <nav class="grid math-menu" aria-label="수학 학습">
      <a class="photo-card" href="/haru/math/calc">

      <a class="photo-card" href="/haru/math/compare">
        <img src="/haru/math/assets/compare.svg" alt="" width="480" height="270">
        <span class="card-copy"><strong>비교하기</strong><small>길이·높이·크기·무게·개수·수</small></span>
      </a>
      <a class="photo-card" href="/haru/money">
        <img src="/typing/learn/images/bank-6.webp" alt="" width="480" height="300">
