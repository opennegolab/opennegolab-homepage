<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>생활학습 | 하루랑</title>
  <link rel="icon" href="/haru/assets/favicon.png">
  <link rel="manifest" href="/haru/manifest.webmanifest">
  <link rel="stylesheet" href="/haru/brand.css?v=1">
  <link rel="stylesheet" href="/typing/learn/style.css?v=3">
  <script type="module" src="/typing/learn/app.js?v=3"></script>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="haru-return" href="/haru" hidden aria-label="하루랑 처음으로">
        <img src="/haru/assets/logo.png" width="123" height="44" alt="하루랑">
      </a>
      <button type="button" id="back" hidden>이전 단계</button>
      <button type="button" id="home" hidden>처음으로</button>
      <button type="button" id="listen" class="listen">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zM16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12"/></svg>
        안내 듣기
      </button>
    </div>
  </header>
  <main id="app"></main>
  <p id="voice-status" role="status" hidden></p>
  <noscript>생활학습을 하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
</body>
</html>
