<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>타자 연습</title>
<meta name="description" content="듣고 쓰는 받아쓰기, 질문에 답하기로 한글 타자를 연습해요.">
<!-- 전용 링크로만 들어오는 학습 화면이라 검색에는 올리지 않는다 -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F7FC">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root{
    --bg:#F4F7FC; --card:#FFFFFF; --ink:#232B40; --ink-2:#4A536B; --ink-soft:#7A839A; --line:#E6EBF3; --line-2:#D5DDEA;
    --blue:#4C8DF0; --blue-d:#2F6FD6; --blue-soft:#EAF2FF; --blue-mid:#CFE1FD;
    --mint:#25B08C; --mint-d:#168469; --mint-soft:#E1F6EF;
    --lav:#8A72E6; --lav-d:#5E45C4; --lav-soft:#EFEBFF;
    --yellow:#F2B42A; --yellow-d:#8C6400; --yellow-soft:#FFF4D4;
    --coral:#E05C7C; --coral-soft:#FFE8EE;
    --r-lg:28px; --r:20px; --r-sm:14px;
    --shadow:0 1px 1px rgba(35,43,64,.03), 0 2px 6px rgba(35,43,64,.04), 0 16px 40px -12px rgba(35,43,64,.12);
    --shadow-sm:0 1px 2px rgba(35,43,64,.05), 0 4px 12px -4px rgba(35,43,64,.10);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size:17px; line-height:1.5; letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
    min-height:100vh; min-height:100dvh; position:relative;
  }
  /* 은은한 파스텔 배경 */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(40rem 26rem at 8% -6%, rgba(76,141,240,.13), transparent 70%),
      radial-gradient(34rem 24rem at 100% 4%, rgba(138,114,230,.12), transparent 70%),
      radial-gradient(36rem 26rem at 50% 108%, rgba(37,176,140,.10), transparent 70%);
  }
  button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; border:none; background:none; }
  button:disabled{ cursor:not-allowed; }
  a{ color:inherit; }
  :focus-visible{ outline:3px solid rgba(76,141,240,.55); outline-offset:3px; border-radius:12px; }
  svg.i{ width:1.2em; height:1.2em; flex:none; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .wrap{ width:100%; max-width:720px; margin:0 auto; padding:28px 18px 48px; }
  .hidden{ display:none !important; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* ---------- 공통 ---------- */
  .card{ background:var(--card); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:26px; border:1px solid rgba(230,235,243,.7); }
  .stack > * + *{ margin-top:16px; }
  .step{ display:flex; align-items:center; gap:10px; font-size:1.02rem; font-weight:800; color:var(--ink); margin-bottom:14px; }
  .step .n{ width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-size:.82rem; font-weight:900; background:var(--blue-soft); color:var(--blue-d); }
  .step .side{ margin-left:auto; }
  .sub-label{ font-size:.86rem; font-weight:800; color:var(--ink-soft); margin:20px 0 10px; }
  .note{ font-size:.86rem; color:var(--ink-soft); line-height:1.6; }
  .note b{ color:var(--ink-2); }
  .warn{ display:flex; gap:10px; align-items:flex-start; background:var(--yellow-soft); color:var(--yellow-d); border-radius:var(--r); padding:14px 16px; font-size:.93rem; font-weight:600; line-height:1.55; }

  /* 버튼 */
  .btn{
    border-radius:16px; padding:14px 20px; font-weight:800; font-size:1.02rem; min-height:54px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s var(--ease), background .15s, box-shadow .15s, color .15s;
  }
  .btn:active:not(:disabled){ transform:translateY(1px) scale(.99); }
  .btn-primary{ background:linear-gradient(180deg,#5B98F3,var(--blue)); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 8px 20px -6px rgba(76,141,240,.65); }
  .btn-primary:hover:not(:disabled){ background:linear-gradient(180deg,#4C8DF0,var(--blue-d)); }
  .btn-primary:disabled{ background:#C4D3EA; box-shadow:none; color:#F4F7FC; }
  .btn-soft{ background:var(--blue-soft); color:var(--blue-d); }
  .btn-soft:hover{ background:#DDEAFE; }
  .btn-mint{ background:var(--mint-soft); color:var(--mint-d); }
  .btn-lav{ background:var(--lav-soft); color:var(--lav-d); }
  .btn-yellow{ background:var(--yellow-soft); color:var(--yellow-d); }
  .btn-white{ background:#fff; color:var(--ink-2); box-shadow:var(--shadow-sm); }
  .btn:disabled:not(.btn-primary){ opacity:.5; }

  /* 세그먼트 (문제 수 · 빠르기) */
  .seg{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; background:#F1F4FA; padding:5px; border-radius:18px; }
  .seg button{ border-radius:14px; min-height:48px; font-weight:800; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:8px; transition:background .15s, color .15s, box-shadow .15s; }
  .seg button:hover{ color:var(--ink-2); }
  .seg button[aria-pressed="true"]{ background:#fff; color:var(--blue-d); box-shadow:var(--shadow-sm); }
  .speed{ display:inline-flex; gap:2px; align-items:flex-end; height:14px; }
  .speed i{ width:4px; border-radius:2px; background:currentColor; opacity:.25; }
  .speed i:nth-child(1){ height:6px; } .speed i:nth-child(2){ height:10px; } .speed i:nth-child(3){ height:14px; }
  .speed.s1 i:nth-child(1), .speed.s2 i:nth-child(-n+2), .speed.s3 i{ opacity:1; }

  /* ---------- 처음 화면 ---------- */
  .hero{ text-align:center; padding:10px 0 22px; }
  .keys{ display:inline-flex; gap:8px; align-items:flex-end; }
  .keycap{
    display:grid; place-items:center; width:62px; height:62px; border-radius:16px; font-size:1.9rem; font-weight:900; color:var(--ink);
    background:linear-gradient(180deg,#fff,#F6F8FC); border:1px solid var(--line-2);
    box-shadow:0 5px 0 var(--line-2), 0 12px 22px -10px rgba(35,43,64,.25);
    animation:keyin .5s var(--ease) both;
  }
  .keycap:nth-child(2){ animation-delay:.06s; background:linear-gradient(180deg,#fff,var(--blue-soft)); }
  .keycap:nth-child(4){ animation-delay:.12s; background:linear-gradient(180deg,#fff,var(--lav-soft)); }
  .keycap:nth-child(5){ animation-delay:.18s; background:linear-gradient(180deg,#fff,var(--mint-soft)); }
  .keys .gap{ width:6px; }
  @keyframes keyin{ from{ transform:translateY(-10px); opacity:0; } to{ transform:none; opacity:1; } }
  .hero p{ color:var(--ink-soft); margin-top:16px; font-weight:600; }

  .modes{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  a.mode{ text-decoration:none; color:inherit; }
  .mode.setup{ background:linear-gradient(180deg,#fff,#FFFBEF); }
  .mode.setup .ico{ background:var(--yellow-soft); color:#D99A0B; }
  .mode.setup .tick{ border:none; background:var(--yellow-soft); color:var(--yellow-d); }
  .mode.setup:hover{ border-color:var(--yellow); box-shadow:0 10px 24px -12px rgba(242,180,42,.55); }
  .mode .txt{ display:flex; flex-direction:column; gap:2px; }
  .mode{
    position:relative; text-align:left; border:2px solid var(--line); background:#fff; border-radius:22px;
    padding:18px; display:flex; flex-direction:column; gap:2px; transition:border-color .15s, box-shadow .2s, transform .15s var(--ease);
  }
  .mode:hover{ border-color:var(--line-2); transform:translateY(-1px); }
  .mode .ico{ width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--blue-soft); color:var(--blue); margin-bottom:12px; }
  .mode .ico svg{ width:28px; height:28px; }
  .mode.qa .ico{ background:var(--lav-soft); color:var(--lav); }
  .mode .name{ font-size:1.16rem; font-weight:900; }
  .mode .desc{ font-size:.88rem; color:var(--ink-soft); }
  .mode .cnt{ align-self:flex-start; margin-top:12px; font-size:.78rem; font-weight:800; color:var(--ink-soft); background:#F1F4FA; border-radius:999px; padding:3px 10px; }
  .mode .tick{ position:absolute; top:14px; right:14px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line-2); color:transparent; transition:all .15s; }
  .mode .tick svg{ width:15px; height:15px; stroke-width:3; }
  .mode[aria-pressed="true"]{ border-color:var(--blue); background:linear-gradient(180deg,#fff, #F6F9FF); box-shadow:0 10px 24px -12px rgba(76,141,240,.6); }
  .mode[aria-pressed="true"] .tick{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .mode[aria-pressed="true"] .cnt{ background:var(--blue-soft); color:var(--blue-d); }
  .mode.qa[aria-pressed="true"]{ border-color:var(--lav); background:linear-gradient(180deg,#fff,#F9F7FF); box-shadow:0 10px 24px -12px rgba(138,114,230,.6); }
  .mode.qa[aria-pressed="true"] .tick{ background:var(--lav); border-color:var(--lav); }
  .mode.qa[aria-pressed="true"] .cnt{ background:var(--lav-soft); color:var(--lav-d); }

  .preview{ white-space:nowrap; display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:.9rem; color:var(--blue-d); background:var(--blue-soft); padding:8px 14px; border-radius:999px; }
  .preview svg{ width:14px; height:14px; fill:currentColor; stroke:none; }
  .teacher{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tcard{
    display:flex; align-items:center; gap:12px; text-align:left; border:2px solid var(--line); border-radius:20px; padding:12px 14px; min-height:72px;
    transition:border-color .15s, background .15s;
  }
  .tcard .av{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; flex:none; }
  .tcard .av svg{ width:24px; height:24px; }
  .tcard[data-teacher="f"] .av{ background:var(--coral-soft); color:var(--coral); }
  .tcard[data-teacher="m"] .av{ background:var(--blue-soft); color:var(--blue); }
  .tcard b{ display:block; font-size:1rem; font-weight:800; }
  .tcard small{ display:block; font-size:.78rem; font-weight:600; color:var(--ink-soft); }
  .tcard[aria-pressed="true"]{ border-color:var(--blue); background:#F7FAFF; }
  .tcard:disabled{ opacity:.55; background:#FAFBFD; }
  .tcard:disabled .av{ background:#EEF1F6; color:#A9B1C3; }
  .selwrap{ position:relative; margin-top:12px; }
  .selwrap svg{ position:absolute; right:14px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--ink-soft); }
  select{
    width:100%; font:inherit; font-size:.92rem; font-weight:600; padding:12px 40px 12px 14px; border-radius:14px; border:2px solid var(--line);
    background:#fff; color:var(--ink-2); min-height:50px; appearance:none; -webkit-appearance:none;
  }
  select:disabled{ background:#FAFBFD; color:var(--ink-soft); }

  .start-wrap{ padding-top:4px; }
  .start{ width:100%; font-size:1.2rem; min-height:64px; border-radius:22px; }
  .start svg{ width:22px; height:22px; transition:transform .2s var(--ease); }
  .start:hover:not(:disabled) svg{ transform:translateX(3px); }
  .history{ list-style:none; }
  .history li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:.92rem; }
  .history li:first-child{ border-top:none; padding-top:0; }
  .history .m{ width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:var(--blue-soft); color:var(--blue); flex:none; }
  .history .m.qa{ background:var(--lav-soft); color:var(--lav); }
  .history .m svg{ width:18px; height:18px; }
  .history .t{ flex:1; min-width:0; }
  .history .t b{ display:block; font-weight:700; }
  .history .t span{ font-size:.8rem; color:var(--ink-soft); }
  .history .s{ font-weight:900; font-size:1.05rem; color:var(--blue-d); }

  /* ---------- 학습 화면 ---------- */
  .topbar{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .iconbtn{ width:48px; height:48px; border-radius:16px; background:#fff; box-shadow:var(--shadow-sm); display:grid; place-items:center; color:var(--ink-2); flex:none; transition:color .15s; }
  .iconbtn:hover{ color:var(--blue-d); }
  .progress{ flex:1; min-width:0; }
  .progress .txt{ display:flex; justify-content:space-between; align-items:baseline; font-size:.9rem; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  .progress .txt b{ color:var(--ink); font-size:1.15rem; font-weight:900; }
  .avg{ display:inline-flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:4px 12px; box-shadow:var(--shadow-sm); font-size:.84rem; }
  .avg b{ font-size:1rem !important; color:var(--blue-d) !important; }
  .segs{ display:flex; gap:4px; height:10px; }
  .segs i{ flex:1; border-radius:999px; background:var(--blue-mid); opacity:.55; transition:background .3s, opacity .3s; }
  .segs i.p{ background:var(--mint); opacity:1; } .segs i.h{ background:var(--yellow); opacity:1; } .segs i.z{ background:var(--lav); opacity:1; }
  .segs i.now{ background:var(--blue); opacity:1; }
  .segs.dense{ gap:0; border-radius:999px; overflow:hidden; background:var(--blue-mid); }
  .segs.dense i{ border-radius:0; }

  .stage{ min-height:250px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; position:relative; overflow:hidden; padding:30px 24px; }
  .qtag{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:800; padding:5px 12px; border-radius:999px; background:var(--blue-soft); color:var(--blue-d); margin-bottom:16px; }
  .qtag svg{ width:15px; height:15px; }
  .qtag.qa{ background:var(--lav-soft); color:var(--lav-d); }
  .question{ font-size:clamp(1.65rem, 5.4vw, 2.5rem); font-weight:900; line-height:1.35; letter-spacing:-.02em; word-break:keep-all; overflow-wrap:anywhere; max-width:22ch; }
  /* 받아쓰기: 큰 스피커 버튼 */
  .listen-big{
    position:relative; width:118px; height:118px; border-radius:50%; display:grid; place-items:center; color:#fff;
    background:radial-gradient(circle at 35% 30%, #74ADF6, var(--blue) 60%, var(--blue-d)); box-shadow:0 14px 30px -10px rgba(76,141,240,.75);
    transition:transform .15s var(--ease);
  }
  .listen-big:hover{ transform:scale(1.03); }
  .listen-big svg{ width:50px; height:50px; stroke-width:2; }
  .listen-big::before, .listen-big::after{ content:""; position:absolute; inset:0; border-radius:50%; border:3px solid var(--blue); opacity:0; }
  .listen-big.speaking::before{ animation:ring 1.6s ease-out infinite; }
  .listen-big.speaking::after{ animation:ring 1.6s .8s ease-out infinite; }
  @keyframes ring{ from{ transform:scale(1); opacity:.5; } to{ transform:scale(1.55); opacity:0; } }
  .listen-cap{ margin-top:14px; font-weight:800; color:var(--ink-2); }
  .hint{ color:var(--ink-soft); margin-top:2px; font-size:.92rem; }
  /* 질문 모드: 작은 다시 듣기 버튼 */
  .listen-pill{ margin-top:20px; display:inline-flex; align-items:center; gap:8px; padding:10px 18px; min-height:48px; border-radius:999px; background:var(--yellow-soft); color:var(--yellow-d); font-weight:800; }
  .wave{ display:inline-flex; gap:3px; align-items:center; height:18px; }
  .wave i{ width:4px; height:6px; background:currentColor; border-radius:2px; opacity:.6; }
  .speaking .wave i{ animation:wave .8s infinite ease-in-out; }
  .speaking .wave i:nth-child(2){ animation-delay:.15s; } .speaking .wave i:nth-child(3){ animation-delay:.3s; }
  @keyframes wave{ 0%,100%{ height:5px; } 50%{ height:18px; } }

  .answer-box{
    margin-top:14px; display:flex; align-items:center; gap:10px; background:#fff; border-radius:24px; padding:8px 8px 8px 18px;
    border:2px solid var(--blue-mid); box-shadow:var(--shadow); scroll-margin:90px; transition:border-color .15s, box-shadow .15s;
  }
  .answer-box:focus-within{ border-color:var(--blue); box-shadow:0 0 0 6px rgba(76,141,240,.14), var(--shadow); }
  .answer-box > svg{ width:26px; height:26px; color:var(--blue); opacity:.8; }
  .answer{
    flex:1; min-width:0; font:inherit; font-size:clamp(1.35rem, 4.6vw, 1.85rem); font-weight:700; letter-spacing:.01em;
    padding:12px 4px; border:none; background:transparent; color:var(--ink); outline:none; min-height:60px;
  }
  .answer::placeholder{ color:#AEB6C7; font-weight:600; }
  .submit{ flex:none; min-width:104px; border-radius:18px; min-height:60px; }
  .submit svg{ width:18px; height:18px; }
  .under{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:0 6px; font-size:.84rem; color:var(--ink-soft); gap:8px; flex-wrap:wrap; }
  .msg{ min-height:1.4em; color:var(--coral); font-weight:800; }
  kbd{ font-family:inherit; font-size:.76rem; font-weight:800; color:var(--ink-2); background:#fff; border:1px solid var(--line-2); border-bottom-width:3px; border-radius:7px; padding:1px 7px; }

  /* 점수 원 */
  .ring{ position:relative; width:var(--sz,132px); height:var(--sz,132px); margin:0 auto; }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:10; }
  .ring .bg{ stroke:#EEF2F8; }
  .ring .fg{ stroke:var(--c,var(--blue)); stroke-linecap:round; stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:fill .9s .1s var(--ease) forwards; }
  @keyframes fill{ to{ stroke-dashoffset:var(--off); } }
  .ring .score{ position:absolute; inset:0; display:grid; place-items:center; align-content:center; font-weight:900; font-size:calc(var(--sz,132px) * .3); line-height:1; color:var(--c,var(--blue)); letter-spacing:-.03em; }
  .ring .score small{ font-size:.38em; font-weight:800; margin-top:4px; color:var(--ink-soft); letter-spacing:0; }
  .t100{ --c:var(--mint); } .tmid{ --c:var(--blue); } .tlow{ --c:var(--lav); }

  .fb{ width:100%; animation:pop .3s var(--ease); }
  @keyframes pop{ from{ transform:translateY(6px) scale(.98); opacity:0; } to{ transform:none; opacity:1; } }
  .fb .say{ font-size:1.3rem; font-weight:900; margin-top:12px; letter-spacing:-.02em; }
  .fb .fq{ font-size:.9rem; font-weight:700; color:var(--ink-soft); margin-bottom:14px; }
  .compare{ margin:18px auto 0; text-align:left; max-width:540px; background:#F7F9FC; border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:8px 14px; align-items:baseline; }
  .compare dt{ font-size:.76rem; font-weight:900; color:var(--ink-soft); white-space:nowrap; padding:2px 8px; border-radius:8px; background:#fff; }
  .compare dd{ font-size:1.2rem; font-weight:700; word-break:break-all; letter-spacing:.02em; }
  mark{ background:none; color:inherit; border-radius:5px; padding:0 1px; }
  mark.wrong{ background:var(--coral-soft); color:var(--coral); }
  mark.extra{ background:var(--coral-soft); color:var(--coral); text-decoration:line-through; text-decoration-thickness:2px; }
  mark.miss{ background:var(--yellow-soft); color:var(--yellow-d); box-shadow:inset 0 -3px 0 var(--yellow); }
  mark.fix{ background:var(--mint-soft); color:var(--mint-d); }
  mark.sp{ font-size:.75em; opacity:.9; }
  .legend{ font-size:.78rem; font-weight:600; color:var(--ink-soft); margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .next-row{ margin-top:20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .next-row .btn{ min-height:48px; padding:10px 20px; }
  .next-row .btn svg{ width:18px; height:18px; }
  .timer{ width:140px; height:5px; border-radius:999px; background:var(--line); overflow:hidden; }
  .timer i{ display:block; height:100%; width:100%; background:var(--blue); transform-origin:left; border-radius:999px; }
  .timer i.run{ animation:shrink var(--t,1.8s) linear forwards; }
  @keyframes shrink{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }

  /* 별 축하 */
  .burst{ position:absolute; inset:0; pointer-events:none; }
  .burst span{ position:absolute; left:50%; top:30%; width:22px; height:22px; animation:fly 1s var(--ease) forwards; }
  .burst svg{ width:100%; height:100%; }
  @keyframes fly{ from{ transform:translate(-50%,-50%) scale(.3); opacity:1; } to{ transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity:0; } }

  /* ---------- 결과 화면 ---------- */

  .final .mode-name{ font-size:.86rem; color:var(--ink-soft); font-weight:700; margin-top:2px; }
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; }
  .tile{ border-radius:18px; padding:14px 6px; background:#F4F7FC; }

  .tile.tpart{ background:var(--yellow-soft); } .tile.tpart b{ color:var(--yellow-d); }
  .tile.t0{ background:var(--lav-soft); } .tile.t0 b{ color:var(--lav-d); }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .list-head .seg{ grid-auto-columns:auto; }
  .list-head .seg button{ min-height:38px; padding:0 14px; font-size:.88rem; }
  .rlist{ list-style:none; }
  .rlist li{ padding:16px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:auto 1fr auto; gap:4px 14px; align-items:start; }
  .rlist li:first-child{ border-top:none; }
  .rlist .no{ width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:#F1F4FA; font-weight:800; font-size:.85rem; color:var(--ink-soft); }
  .rlist .q{ font-size:.86rem; font-weight:700; color:var(--ink-soft); margin-bottom:2px; }
  .rlist .line{ font-size:1.06rem; font-weight:700; word-break:break-all; line-height:1.7; }
  .rlist .line em{ font-style:normal; font-size:.7rem; font-weight:900; color:var(--ink-soft); background:#F1F4FA; border-radius:6px; padding:1px 6px; margin-right:8px; vertical-align:2px; }
  .badge{ font-weight:900; border-radius:999px; padding:5px 11px; font-size:.86rem; white-space:nowrap; }
  .badge.b100{ background:var(--mint-soft); color:var(--mint-d); }
  .badge.bmid{ background:var(--yellow-soft); color:var(--yellow-d); }
  .badge.b0{ background:var(--lav-soft); color:var(--lav-d); }
  .empty{ text-align:center; padding:18px 0 6px; color:var(--ink-soft); font-weight:700; }

  .loading{ text-align:center; color:var(--ink-soft); font-weight:700; }
  .spinner{ width:38px; height:38px; border:4px solid var(--blue-mid); border-top-color:var(--blue); border-radius:50%; margin:0 auto 12px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:560px){
    body{ font-size:16px; }
    .wrap{ padding:16px 14px 28px; }
    .card{ padding:20px 18px; border-radius:24px; }
    .keycap{ width:52px; height:52px; font-size:1.55rem; border-radius:14px; }
    .mode{ padding:14px; }
    .mode .ico{ width:44px; height:44px; border-radius:14px; margin-bottom:10px; }
    .mode .ico svg{ width:24px; height:24px; }
    .mode .name{ font-size:1rem; white-space:nowrap; letter-spacing:-.03em; }
    .modes{ grid-template-columns:1fr 1fr; }
    /* 휴대폰에서는 문제 설정을 아래에 한 줄로 */
    .mode.setup{ grid-column:1 / -1; flex-direction:row; align-items:center; gap:12px; padding:12px 14px; }
    .mode.setup .ico{ margin:0; }
    .mode.setup .cnt{ display:none; }
    .mode.setup .tick{ position:static; margin-left:auto; order:3; }
    .mode .desc{ font-size:.8rem; word-break:keep-all; }
    .step{ font-size:.96rem; word-break:keep-all; }
    .preview{ padding:7px 11px; font-size:.84rem; }
    .mode .tick{ top:12px; right:12px; width:22px; height:22px; }
    .teacher{ gap:8px; }
    .tcard{ flex-direction:column; text-align:center; padding:12px 8px; gap:6px; }
    .tcard .av{ width:38px; height:38px; }
    .tcard b{ font-size:.92rem; white-space:nowrap; }

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  const FEEDBACK_MS = 1800;
  const RATES = { slow: 0.7, normal: 0.9, fast: 1.1 };

  /* ---------- 이 기기에만 남기는 값 ---------- */
  const local = {
    get(k, d) { try { const v = localStorage.getItem("typing." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("typing." + k, JSON.stringify(v)); } catch (e) {} },
  };
  const settings = Object.assign({ mode: "dictation", count: "10", teacher: "", voiceURI: "", rate: "normal" }, local.get("settings", {}));
  const saveSettings = () => local.set("settings", settings);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const icon = n => "<svg class='i' aria-hidden='true'><use href='#i-" + n + "'/></svg>";
  const tier = sc => sc === 100 ? "t100" : sc >= 50 ? "tmid" : "tlow";
  /* 점수 원 — 둘레만큼 칠한다 */
  function ring(score, size) {
    const r = 52, len = (2 * Math.PI * r).toFixed(1), off = (len * (1 - score / 100)).toFixed(1);
    return "<div class='ring " + tier(score) + "' style='--sz:" + size + "px;--len:" + len + ";--off:" + off + "'>" +
      "<svg viewBox='0 0 120 120' aria-hidden='true'><circle class='bg' cx='60' cy='60' r='" + r + "'/><circle class='fg' cx='60' cy='60' r='" + r + "'/></svg>" +
      "<div class='score'>" + score + "<small>점</small></div></div>";
  }

  const T = window.TypingStore;   /* 문제 저장·채점 — 이 기기 안에서만 (store.js) */

  /* ============================================================
     음성 — 브라우저에 들어 있는 한국어 음성만 쓴다 (Web Speech API)

     Web Speech API 는 목소리의 성별을 알려 주지 않는다. 그래서 이름으로
     확실히 알 수 있는 목소리만 남자/여자로 표시하고, 나머지는
     '구분 정보 없음'으로 둔다. 음높이를 바꿔 남자 목소리처럼 만들지 않는다.
     ============================================================ */
  const KNOWN = [
    /* Windows · Edge */
    [/\bheami\b/i, "f"], [/\bsunhi\b/i, "f"], [/\bjimin\b/i, "f"], [/\bseohyeon\b/i, "f"],
    [/\bsoonbok\b/i, "f"], [/\byujin\b/i, "f"],
    [/\binjoon\b/i, "m"], [/\bhyunsu/i, "m"], [/\bbongjin\b/i, "m"], [/\bgookmin\b/i, "m"],
    /* Apple */
    [/\byuna\b|유나/i, "f"], [/\bsora\b|소라/i, "f"], [/\bminsu\b|민수/i, "m"],
    [/\b(flo|sandy|shelley|grandma)\b/i, "f"], [/\b(eddy|reed|rocko|grandpa)\b/i, "m"],
    /* 이름에 성별이 적힌 경우 (여성을 먼저 본다 — 'female' 안에 'male' 이 들어 있다) */
    [/female|여성|여자/i, "f"], [/\bmale\b|남성|남자/i, "m"],
  ];
  const tts = {
    ok: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
    voices: [],
    token: 0,
    current: null,
    gender(v) {
      const s = v.name + " " + v.voiceURI;
      for (const [re, g] of KNOWN) if (re.test(s)) return g;
      return "";
    },
    load() {
      if (!this.ok) return;
      const all = speechSynthesis.getVoices() || [];
      this.voices = all.filter(v => /^ko([-_]|$)/i.test(v.lang || ""));
    },
    /* 고를 목소리: 직접 고른 것 → 선생님 성별에 맞는 것 중 품질 좋은 것 → 아무 한국어 목소리 */
    pick() {
      const vs = this.voices;
      if (!vs.length) return null;
      if (settings.voiceURI) {
        const v = vs.find(v => v.voiceURI === settings.voiceURI);
        if (v) return v;
      }
      const want = settings.teacher;
      const pool = want ? vs.filter(v => this.gender(v) === want) : vs;
      if (!pool.length) return null;
      const online = navigator.onLine !== false;
      const rank = v => (/natural|online|neural|premium|enhanced/i.test(v.name) ? (online || v.localService ? 2 : -2) : 0)
                      + (v.localService ? (online ? 0 : 3) : (online ? 1 : -3)) + (v.default ? 0.5 : 0);
      return pool.slice().sort((a, b) => rank(b) - rank(a))[0];
    },
    stop() {
      this.token++;
      if (this.ok) speechSynthesis.cancel();
      setSpeaking(false);
    },
    /* 문제가 바뀌면 앞 음성을 끊고 새로 읽는다.
       크롬은 cancel 직후 바로 speak 하면 가끔 무시해서 조금 쉬었다 읽는다 */
    speak(text, opts) {
      if (!this.ok || !text) return false;
      const t = ++this.token;
      speechSynthesis.cancel();
      setTimeout(() => {
        if (t !== this.token) return;
        const u = new SpeechSynthesisUtterance(text);
        const v = (opts && opts.voice) || this.pick();
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "ko-KR";
        u.rate = RATES[settings.rate] || 0.9;
        u.pitch = 1;
        u.onstart = () => { if (t === this.token) setSpeaking(true); };
        u.onend = u.onerror = () => { if (t === this.token) setSpeaking(false); };
        this.current = u;               /* 일부 브라우저는 참조가 없으면 중간에 끊는다 */
        try { speechSynthesis.resume(); } catch (e) {}
        speechSynthesis.speak(u);
      }, 90);
      return true;
    },
    /* 휴대폰 브라우저는 사용자가 누른 순간에 한 번 말해 둬야 그 뒤 자동 읽기가 된다 */
    unlock() {
      if (!this.ok || this.unlocked) return;
      try {
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0; u.lang = "ko-KR";
        speechSynthesis.speak(u);
        this.unlocked = true;
      } catch (e) {}
    },
  };

  function setSpeaking(on) {
    const b = document.querySelector("#stage .listen");
    if (b) b.classList.toggle("speaking", on);
  }

  function voiceLabel(v) {
    const g = tts.gender(v);
    const name = v.name.replace(/\s*-\s*Korean.*$/i, "").replace(/\s*\(Korean.*\)$/i, "");
    return name + " · " + (g === "f" ? "여성" : g === "m" ? "남성" : "구분 정보 없음") + " · " + (v.localService ? "오프라인 가능" : "인터넷 필요");
  }

  function renderVoices() {
    tts.load();
    const vs = tts.voices;
    const has = { f: vs.some(v => tts.gender(v) === "f"), m: vs.some(v => tts.gender(v) === "m") };

    /* 저장해 둔 목소리가 이 기기에 없으면 잊는다 */
    if (settings.voiceURI && !vs.find(v => v.voiceURI === settings.voiceURI)) settings.voiceURI = "";
    if (settings.teacher && !has[settings.teacher]) settings.teacher = "";
    if (!settings.teacher && !settings.voiceURI) settings.teacher = has.f ? "f" : has.m ? "m" : "";

    const picked = tts.pick();
    document.querySelectorAll("[data-teacher]").forEach(b => {
      const g = b.dataset.teacher;
      b.disabled = !has[g];
      b.setAttribute("aria-pressed", String(!!picked && tts.gender(picked) === g));
      $(g + "Note").textContent = has[g] ? (vs.filter(v => tts.gender(v) === g).length + "개 목소리") : "이 기기에 없어요";
    });

    const sel = $("voiceSel");
    sel.innerHTML = "";
    const auto = document.createElement("option");
    auto.value = "";
    auto.textContent = vs.length ? "자동 선택 (선생님 목소리에 맞춰)" : "한국어 목소리를 찾지 못했어요";
    sel.appendChild(auto);
    for (const v of vs) {
      const o = document.createElement("option");
      o.value = v.voiceURI;
      o.textContent = voiceLabel(v);
      sel.appendChild(o);
    }
    sel.value = settings.voiceURI || "";
    sel.disabled = !vs.length;

    saveSettings();
  }

  if (tts.ok) {
    renderVoices();
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged", renderVoices)
                                     : (speechSynthesis.onvoiceschanged = renderVoices);
    /* 안드로이드 크롬은 목소리 목록이 늦게 오고, 알림을 안 주기도 한다 */
    let tries = 0;
    const poll = setInterval(() => { tries++; if (tts.voices.length || tries > 10) clearInterval(poll); renderVoices(); }, 500);
  } else renderVoices();

  document.querySelectorAll("[data-teacher]").forEach(b => b.addEventListener("click", () => {
    settings.teacher = b.dataset.teacher; settings.voiceURI = "";
    renderVoices();
    tts.unlock();
    tts.speak(b.dataset.teacher === "m" ? "안녕하세요. 남자 선생님이에요." : "안녕하세요. 여자 선생님이에요.");
  }));
  $("voiceSel").addEventListener("change", e => {
    settings.voiceURI = e.target.value;
    const v = tts.voices.find(v => v.voiceURI === settings.voiceURI);
    if (v) settings.teacher = tts.gender(v);
    renderVoices();
    tts.speak("안녕하세요. 같이 타자 연습해요.");
  });
  document.querySelectorAll("[data-rate]").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.rate === settings.rate));
    b.addEventListener("click", () => {
      settings.rate = b.dataset.rate; saveSettings();
      document.querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      tts.speak("이 빠르기로 읽어 줄게요.");
    });
  });
  $("previewBtn").addEventListener("click", () => { tts.unlock(); tts.speak("안녕하세요. 오늘은 날씨가 좋아요."); });

  /* ============================================================
     처음 화면
     ============================================================ */
  let counts = null;

  function show(id) {
    for (const s of ["home", "play", "result"]) $(s).classList.toggle("hidden", s !== id);
    window.scrollTo(0, 0);
  }

  function renderHome() {
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === settings.mode)));
    document.querySelectorAll("[data-count]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.count === settings.count)));
    const warn = $("homeWarn");
    let w = "";
    if (counts) {
      $("cnt-dictation").textContent = "문제 " + counts.dictation + "개";
      $("cnt-qa").textContent = "문제 " + counts.qa + "개";
      const n = counts[settings.mode];
      if (!n) w = "아직 문제가 없어요. '문제 설정'에서 문제를 만들어 주세요.";
      else if (settings.count !== "all" && n < Number(settings.count)) w = "등록된 문제가 " + n + "개라서 " + n + "문제만 풀어요.";
    }
    if (!T.store.persistent()) w = (w ? w + " " : "") + "이 브라우저는 저장 공간을 쓸 수 없어, 넣은 문제가 창을 닫으면 사라져요.";
    if (settings.mode === "dictation" && !tts.ok) w = (w ? w + " " : "") + "이 브라우저는 소리 내어 읽기를 지원하지 않아 받아쓰기를 할 수 없어요.";
    warn.textContent = w;
    warn.classList.toggle("hidden", !w);
    $("startBtn").disabled = !counts || !counts[settings.mode] || (settings.mode === "dictation" && !tts.ok);
    renderHistory();
  }

  function renderHistory() {
    const h = local.get("history", []);
    $("historyCard").classList.toggle("hidden", !h.length);
    $("historyList").innerHTML = h.slice(0, 5).map(r => {
      const d = new Date(r.at);
      const when = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      const qa = r.mode === "qa";
      return "<li><span class='m" + (qa ? " qa" : "") + "'>" + icon(qa ? "chat" : "headphones") + "</span>" +
        "<span class='t'><b>" + (qa ? "질문에 답하기" : "받아쓰기") + " · " + r.total + "문제</b><span>" + when + "</span></span>" +
        "<span class='s'>" + r.avg + "점</span></li>";
    }).join("");
  }

  function loadCounts() {
    counts = T.store.counts();
    renderHome();
  }
  /* 다른 탭의 문제 관리 화면에서 바꾸면 바로 반영한다 */
  window.addEventListener("storage", e => { if (e.key === T.KEY && S.phase === "idle") loadCounts(); });

  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { settings.mode = b.dataset.mode; saveSettings(); renderHome(); }));
  document.querySelectorAll("[data-count]").forEach(b => b.addEventListener("click", () => { settings.count = b.dataset.count; saveSettings(); renderHome(); }));
  $("startBtn").addEventListener("click", () => { tts.unlock(); begin({ mode: settings.mode, count: settings.count }); });

  /* ============================================================
     문제 풀기
     phase: loading → answer → grading → feedback → (다음 문제) loading …
     한 단계에서만 다음으로 넘어가게 해서 Enter 를 여러 번 눌러도
     두 번 채점하거나 두 문제를 건너뛰지 않는다
     ============================================================ */
  const S = { mode: "dictation", items: [], i: 0, results: [], phase: "idle", seq: 0, timer: 0, fbAt: 0, last: null };
  const input = $("answer");

  async function begin(req) {
    clearTimeout(S.timer);
    tts.stop();
    S.seq++;
    S.phase = "loading";
    S.mode = req.mode;
    S.last = req;
    show("play");
    $("stage").innerHTML = "<div class='loading'><div class='spinner'></div>문제를 준비하고 있어요</div>";
    /* 문제를 고를 때 그 순간의 내용을 그대로 들고 간다 — 푸는 중에 다른 탭에서 고쳐도 흔들리지 않게 */
    const picked = T.store.pick(req.mode, req.count, req.ids);
    const data = { items: picked.map(x => ({ id: x.id, mode: x.mode, prompt: x.prompt, answers: x.answers, question: x.mode === "qa" ? x.prompt : "" })) };
    if (!data.items.length) {
      $("stage").innerHTML = "<div class='loading'>풀 수 있는 문제가 없어요.<br><br><button type='button' class='btn btn-soft' id='backHome'>처음 화면으로</button></div>";
      $("backHome").onclick = goHome;
      S.phase = "idle";
      return;
    }
    S.items = data.items;
    S.i = 0;
    S.results = [];
    $("qTotal").textContent = S.items.length;
    showQuestion();
  }

  function textOf(item) { return Promise.resolve(item.prompt); }

  function updateTop() {
    const done = S.results.length;
    $("qNo").textContent = Math.min(S.i + 1, S.items.length);
    const pct = Math.round(done / S.items.length * 100);
    const bar = $("barWrap");
    bar.setAttribute("aria-valuenow", pct);
    /* 문제마다 한 칸 — 끝난 문제는 점수에 따라 색을 칠한다. 너무 많으면 칸 사이를 붙인다 */
    bar.classList.toggle("dense", S.items.length > 30);
    let h = "";
    for (let k = 0; k < S.items.length; k++) {
      const r = S.results[k];
      h += "<i class='" + (r ? (r.score === 100 ? "p" : r.score > 0 ? "h" : "z") : k === S.i ? "now" : "") + "'></i>";
    }
    bar.innerHTML = h;
    $("avgNow").textContent = done ? Math.round(S.results.reduce((s, r) => s + r.score, 0) / done) : "-";
  }

  async function showQuestion() {
    const seq = ++S.seq;
    const item = S.items[S.i];
    S.phase = "loading";
    clearTimeout(S.timer);
    tts.stop();
    input.value = "";
    setMsg("");
    updateTop();
    $("submitBtn").disabled = false;
    $("submitBtn").textContent = "제출";

    const qa = S.mode === "qa";
    $("stage").innerHTML = qa
      ? "<span class='qtag qa'>" + icon("chat") + "질문에 답하기</span>" +
        "<div class='question'>" + esc(item.question) + "</div>" +
        "<button type='button' class='listen listen-pill' id='listenBtn'><span class='wave' aria-hidden='true'><i></i><i></i><i></i></span>질문 다시 듣기</button>"
      : "<span class='qtag'>" + icon("headphones") + "받아쓰기</span>" +
        "<button type='button' class='listen listen-big' id='listenBtn' aria-label='다시 듣기'>" + icon("speaker") + "</button>" +
        "<div class='listen-cap'>눌러서 다시 듣기</div><div class='hint'>잘 듣고 그대로 써 보세요</div>";
    const lb = $("listenBtn");
    lb.addEventListener("pointerdown", e => e.preventDefault());     /* 입력창 포커스를 빼앗지 않는다 (휴대폰 키보드 유지) */
    lb.addEventListener("click", replay);

    focusInput();
    S.phase = "answer";
    S.fbAt = 0;

    let text;
    try { text = await textOf(item); }
    catch (e) {
      if (seq === S.seq) setMsg("문제를 가져오지 못했어요. 다시 듣기를 눌러 주세요.");
      return;
    }
    if (seq !== S.seq) return;
    tts.speak(text);
  }

  async function replay() {
    const item = S.items[S.i];
    if (!item) return;
    try { tts.speak(await textOf(item)); setMsg(""); }
    catch (e) { setMsg("문제를 가져오지 못했어요. 인터넷 연결을 확인해 주세요."); }
    if (S.phase === "answer") focusInput();
  }

  function focusInput() {
    try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
    keepVisible();
  }

  function setMsg(t) { $("msg").textContent = t; }

  async function submit() {
    if (S.phase === "feedback") {
      /* 결과가 뜬 직후의 Enter 는 무시한다 — 제출하려고 누른 Enter 가 두 번 들어오는 기기가 있다 */
      if (Date.now() - S.fbAt > 500) next();
      return;
    }
    if (S.phase !== "answer") return;
    const value = input.value.normalize("NFC").replace(/\s+/g, " ").trim();
    if (!value) { setMsg("답을 먼저 써 주세요."); focusInput(); return; }
    S.phase = "grading";
    const seq = S.seq;
    const item = S.items[S.i];
    $("submitBtn").disabled = true;
    setMsg("");
    const r = T.grade(item, value);
    if (seq !== S.seq) return;
    S.results.push({ id: item.id, question: item.question || "", score: r.score, answer: r.answer, input: r.input, ops: r.ops, feedback: r.feedback });
    showFeedback(r, item);
  }

  function next() {
    if (S.phase !== "feedback") return;
    clearTimeout(S.timer);
    S.phase = "loading";
    S.i++;
    if (S.i >= S.items.length) finish();
    else showQuestion();
  }

  function showFeedback(r, item) {
    tts.stop();
    S.phase = "feedback";
    S.fbAt = Date.now();
    updateTop();
    const last = S.i + 1 >= S.items.length;
    $("stage").innerHTML =
      "<div class='fb'>" +
        (S.mode === "qa" ? "<div class='fq'>" + esc(item.question) + "</div>" : "") +
        ring(r.score, 124) +
        "<div class='say'>" + esc(r.feedback) + "</div>" +
        (r.score === 100 ? "" :
          "<dl class='compare'><dt>정답</dt><dd>" + diffHtml(r.ops, "answer") + "</dd><dt>내 답</dt><dd>" + diffHtml(r.ops, "input") + "</dd></dl>" +
          "<div class='legend'><span><mark class='wrong'>가</mark> 틀린 글자</span><span><mark class='extra'>가</mark> 더 쓴 글자</span><span><mark class='miss'>가</mark> 빠진 글자</span></div>") +
        "<div class='next-row'><button type='button' class='btn btn-soft' id='nextBtn'>" + (last ? "결과 보기" : "바로 다음 문제") + icon("arrow") + "</button>" +
        "<div class='timer' aria-hidden='true'><i class='run' style='--t:" + FEEDBACK_MS + "ms'></i></div></div>" +
      "</div>" +
      (r.score === 100 ? "<div class='burst' aria-hidden='true'>" + stars() + "</div>" : "");
    const nb = $("nextBtn");
    nb.addEventListener("pointerdown", e => e.preventDefault());
    nb.addEventListener("click", next);
    $("submitBtn").textContent = last ? "결과" : "다음";
    $("submitBtn").disabled = false;
    S.timer = setTimeout(next, FEEDBACK_MS);
    keepVisible();
  }

  function stars() {
    let h = "";
    for (let k = 0; k < 10; k++) {
      const ang = (k / 10) * Math.PI * 2;
      const dist = 90 + Math.random() * 60;
      const color = ["#F2B42A", "#25B08C", "#4C8DF0", "#8A72E6", "#E05C7C"][k % 5];
      h += "<span style='--x:" + Math.round(Math.cos(ang) * dist) + "px;--y:" + Math.round(Math.sin(ang) * dist * .7) + "px;--r:" + Math.round(Math.random() * 180) + "deg'>" +
        "<svg viewBox='0 0 24 24'><use href='#i-star' fill='" + color + "' stroke='none'/></svg></span>";
    }
    return h;
  }

  /* 틀린 곳 표시 — 서버가 보낸 비교 결과(ops)를 그대로 그린다.
     띄어쓰기를 틀렸을 때는 빈칸이 보이지 않으므로 '␣' 로 보여 준다 */
  function ch(c, cls) {
    if (c === " ") return "<mark class='" + cls + " sp' title='띄어쓰기'>␣</mark>";
    return "<mark class='" + cls + "'>" + esc(c) + "</mark>";
  }
  function diffHtml(ops, side) {
    let h = "";
    for (const o of ops || []) {
      if (side === "answer") {
        if (o.t === "eq") h += esc(o.a);
        else if (o.t === "sub") h += ch(o.a, "fix");
        else if (o.t === "del") h += ch(o.a, "miss");
      } else {
        if (o.t === "eq") h += esc(o.u);
        else if (o.t === "sub") h += ch(o.u, "wrong");
        else if (o.t === "ins") h += ch(o.u, "extra");
      }
    }
    return h || "<span class='note'>(없음)</span>";
  }

  /* ---------- 키보드 ----------
     한글은 글자를 조합하는 중에 Enter 가 들어온다. 이때 바로 제출하면 마지막 글자가
     빠지거나, 기기에 따라 Enter 가 두 번 들어와 두 번 제출된다.
     조합 중 Enter 는 '제출 예약'만 해 두고 조합이 끝난 뒤(compositionend) 제출한다.
     e.code 는 조합 중에도 실제 누른 키를 알려 준다 (Windows 는 key 가 'Process' 로 온다) */
  let composing = false, pendingEnter = false, pendingTimer = 0;
  const isEnter = e => e.key === "Enter" || e.code === "Enter" || e.code === "NumpadEnter" || e.keyCode === 13;

  input.addEventListener("compositionstart", () => { composing = true; });
  input.addEventListener("compositionend", () => {
    composing = false;
    if (pendingEnter) { pendingEnter = false; clearTimeout(pendingTimer); setTimeout(submit, 0); }
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Escape" && !e.isComposing) { e.preventDefault(); replay(); return; }
    if (!isEnter(e)) return;
    if (e.isComposing || composing || e.keyCode === 229) {
      pendingEnter = true;
      clearTimeout(pendingTimer);
      /* compositionend 가 오지 않는 키보드도 있어 잠시 뒤 직접 제출한다 */
      pendingTimer = setTimeout(() => { if (pendingEnter) { pendingEnter = false; submit(); } }, 250);
      return;
    }
    e.preventDefault();
    setTimeout(submit, 0);
  });
  /* 휴대폰 키보드의 완료·이동 버튼, 제출 버튼은 form 제출로 들어온다 */
  $("form").addEventListener("submit", e => { e.preventDefault(); setTimeout(submit, 0); });
  $("submitBtn").addEventListener("pointerdown", e => { if (document.activeElement === input) e.preventDefault(); });
  input.addEventListener("input", () => { if ($("msg").textContent && S.phase === "answer") setMsg(""); });

  /* 키보드 바깥(배경)을 눌러도 입력창으로 돌아온다 */
  document.addEventListener("keydown", e => {
    if ($("play").classList.contains("hidden") || e.target === input) return;
    if (e.key === "Escape") { replay(); return; }
    if (isEnter(e) && S.phase === "feedback" && e.target.tagName !== "BUTTON") { e.preventDefault(); submit(); }
  });

  /* ---------- 휴대폰 키보드가 입력창을 가리지 않게 ---------- */
  function keepVisible() {
    if ($("play").classList.contains("hidden")) return;
    const vv = window.visualViewport;
    const small = vv ? vv.height < window.innerHeight * 0.8 || vv.height < 520 : false;
    document.body.classList.toggle("kbd", small && document.activeElement === input);
    requestAnimationFrame(() => {
      const r = $("form").getBoundingClientRect();
      const h = vv ? vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      if (r.bottom > top + h - 8 || r.top < top) {
        $("form").scrollIntoView({ block: small ? "end" : "center", behavior: "smooth" });
      }
    });
  }
  if (window.visualViewport) window.visualViewport.addEventListener("resize", keepVisible);
  input.addEventListener("focus", () => setTimeout(keepVisible, 250));
  input.addEventListener("blur", () => setTimeout(() => document.body.classList.remove("kbd"), 200));

  function goHome() {
    clearTimeout(S.timer);
    S.seq++;
    S.phase = "idle";
    tts.stop();
    input.blur();
    show("home");
    renderHome();
    loadCounts();
  }
  $("quitBtn").addEventListener("click", () => {
    if (S.phase !== "idle" && S.results.length < S.items.length && S.items.length && !confirm("연습을 그만하고 처음 화면으로 갈까요?")) { focusInput(); return; }
    goHome();
  });

  /* ============================================================
     결과
     ============================================================ */
  let filter = "all";

  function finish() {
    S.phase = "idle";
    tts.stop();
    input.blur();
    const rs = S.results;
    const total = rs.length;
    const avg = total ? Math.round(rs.reduce((s, r) => s + r.score, 0) / total) : 0;
    const perfect = rs.filter(r => r.score === 100).length;
    const zero = rs.filter(r => r.score === 0).length;
    const partial = total - perfect - zero;

    const h = local.get("history", []);
    h.unshift({ at: Date.now(), mode: S.mode, total, avg, perfect, partial, zero });
    local.set("history", h.slice(0, 30));

    const medal = avg === 100 ? icon("trophy") + "모두 100점" : avg >= 80 ? icon("star") + "아주 잘했어요" : icon("check") + "연습 완료";
    const say = avg === 100 ? "모두 맞았어요! 정말 멋져요." : avg >= 80 ? "아주 잘했어요!" : avg >= 50 ? "끝까지 잘했어요! 조금만 더 연습해요." : "끝까지 해낸 것이 대단해요. 다시 해 봐요!";
    $("finalCard").innerHTML =
      "<div class='medal'>" + medal + "</div>" +
      ring(avg, 168) +
      "<div class='say'>" + say + "</div>" +
      "<div class='mode-name'>" + (S.mode === "qa" ? "질문에 답하기" : "받아쓰기") + " 평균 점수</div>" +
      "<div class='tiles'>" +
        "<div class='tile'><b>" + total + "</b><span>전체 문제</span></div>" +
        "<div class='tile t100'><b>" + perfect + "</b><span>100점</span></div>" +
        "<div class='tile tpart'><b>" + partial + "</b><span>부분 점수</span></div>" +
        "<div class='tile t0'><b>" + zero + "</b><span>0점</span></div>" +
      "</div>" +
      (avg >= 80 ? "<div class='burst' aria-hidden='true'>" + stars() + "</div>" : "");

    const wrong = rs.filter(r => r.score < 100).length;
    $("retryWrong").disabled = !wrong;
    $("retryWrong").innerHTML = icon("pencil") + (wrong ? "100점 아닌 문제만 다시 (" + wrong + "개)" : "다시 풀 문제가 없어요");
    filter = wrong ? "wrong" : "all";
    renderList();
    show("result");
  }

  function renderList() {
    document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.filter === filter)));
    const list = S.results.map((r, k) => ({ r, k })).filter(x => filter === "all" || x.r.score < 100);
    $("rlist").innerHTML = list.length ? list.map(({ r, k }) => {
      const b = r.score === 100 ? "b100" : r.score > 0 ? "bmid" : "b0";
      return "<li><span class='no'>" + (k + 1) + "</span><div>" +
        (r.question ? "<div class='q'>" + esc(r.question) + "</div>" : "") +
        "<div class='line'><em>정답</em>" + (r.score === 100 ? esc(r.answer) : diffHtml(r.ops, "answer")) + "</div>" +
        "<div class='line'><em>내 답</em>" + (r.score === 100 ? esc(r.input) : diffHtml(r.ops, "input")) + "</div>" +
        "</div><span class='badge " + b + "'>" + r.score + "점</span></li>";
    }).join("") : "<li style='display:block'><div class='empty'>모든 문제를 100점 받았어요!</div></li>";
  }
  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { filter = b.dataset.filter; renderList(); }));

  $("retryWrong").addEventListener("click", () => {
    const ids = S.results.filter(r => r.score < 100).map(r => r.id);
    if (ids.length) begin({ mode: S.mode, ids, count: "all" });
  });
  $("retryAll").addEventListener("click", () => begin({ mode: S.mode, ids: S.results.map(r => r.id), count: "all" }));
  $("newRandom").addEventListener("click", () => begin({ mode: S.mode, count: settings.count }));
  $("toHome").addEventListener("click", goHome);

  /* 테스트에서 상태를 들여다볼 수 있게 */
  window.__typing = { S, tts, settings };

  renderHome();
  loadCounts();
})();
</script>
<script src="/hit.js" defer></script>
</body>
</html>
