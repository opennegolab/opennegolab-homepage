<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오선빈 타자연습 — 문제 설정</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  :root{
    --bg:#FBF7F1; --card:#fff; --ink:#2E2A33; --ink-2:#57505E; --ink-soft:#8E8679; --line:#EFE7DB; --line-2:#E2D8C8;
    --blue:#5A8BEA; --blue-d:#3A68C8; --blue-soft:#EAF0FC; --blue-mid:#D4E1F8;
    --mint:#38B48E; --mint-d:#1D8766; --mint-soft:#E2F4EB;
    --lav:#9B7FE6; --lav-d:#6B50C2; --lav-soft:#F1ECFD;
    --yellow:#F2B33F; --yellow-d:#8A5E06; --yellow-soft:#FFF3D8;
    --coral:#E2698A; --coral-soft:#FFE9EF;
    --shadow:0 1px 1px rgba(70,52,34,.03), 0 2px 6px rgba(70,52,34,.04), 0 16px 40px -14px rgba(70,52,34,.12);
    --shadow-sm:0 1px 2px rgba(70,52,34,.05), 0 4px 12px -4px rgba(70,52,34,.10);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif; font-size:15px; line-height:1.5; letter-spacing:-.01em; -webkit-font-smoothing:antialiased; }
  body::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(40rem 24rem at 0% -10%, rgba(240,150,94,.15), transparent 70%), radial-gradient(34rem 22rem at 100% 0%, rgba(90,139,234,.10), transparent 70%); }
  button,input,textarea,select{ font:inherit; color:inherit; }
  button{ cursor:pointer; border:none; background:none; }
  a{ color:inherit; text-decoration:none; }
  :focus-visible{ outline:3px solid rgba(90,139,234,.5); outline-offset:2px; border-radius:10px; }
  svg.i{ width:1.15em; height:1.15em; flex:none; fill:none; stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
  .wrap{ max-width:1040px; margin:0 auto; padding:28px 18px 64px; }
  .hidden{ display:none !important; }

  header{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .logo{ width:46px; height:46px; border-radius:15px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,#F7B58A,#E07A3E); box-shadow:0 8px 18px -8px rgba(224,122,62,.7); }
  .brand .logo svg{ width:24px; height:24px; }
  h1{ font-size:1.35rem; font-weight:900; letter-spacing:-.02em; }
  .brand p{ font-size:.84rem; color:var(--ink-soft); font-weight:600; }
  h2{ font-size:1.02rem; font-weight:900; display:flex; align-items:center; gap:8px; }
  h2 svg{ color:var(--blue); }

  .card{ background:var(--card); border-radius:24px; box-shadow:var(--shadow); border:1px solid rgba(239,231,219,.8); padding:22px; margin-bottom:16px; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:12px; padding:9px 15px; font-weight:800; font-size:.92rem; background:var(--blue-soft); color:var(--blue-d); min-height:42px; transition:background .15s, box-shadow .15s, transform .1s; white-space:nowrap; }
  .btn:hover:not(:disabled){ background:#DCE7FA; }
  .btn:active:not(:disabled){ transform:translateY(1px); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn.primary{ background:linear-gradient(180deg,#6D9BEF,var(--blue)); color:#fff; box-shadow:0 6px 14px -6px rgba(90,139,234,.7); }
  .btn.primary:hover:not(:disabled){ background:linear-gradient(180deg,#5A8BEA,var(--blue-d)); }
  .btn.white{ background:#fff; color:var(--ink-2); box-shadow:var(--shadow-sm); }
  .btn.white:hover{ background:#fff; color:var(--blue-d); }
  .btn.danger{ background:var(--coral-soft); color:var(--coral); }
  .btn.danger:hover:not(:disabled){ background:#FFDDE6; }
  .btn.ghost{ background:transparent; color:var(--ink-soft); }
  .btn.ghost:hover{ background:#F5EFE6; }
  .btn.small{ padding:6px 11px; min-height:34px; font-size:.84rem; border-radius:10px; }
  .btn.line{ background:#fff; color:var(--ink-2); border:1.5px solid var(--line-2); }
  .btn.line:hover{ background:#FBF8F3; }

  input[type=text],input[type=search],textarea{
    width:100%; border:2px solid var(--line); border-radius:14px; padding:11px 14px; background:#fff; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus,input[type=search]:focus,textarea:focus{ border-color:var(--blue); box-shadow:0 0 0 4px rgba(90,139,234,.12); }
  textarea{ min-height:150px; resize:vertical; font-size:.94rem; line-height:1.6; }
  input[type=checkbox]{ width:17px; height:17px; accent-color:var(--blue); vertical-align:middle; }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow{ flex:1; min-width:180px; }
  .note{ color:var(--ink-soft); font-size:.86rem; }
  .note b{ color:var(--ink-2); }
  .warn{ display:flex; gap:10px; background:var(--yellow-soft); color:var(--yellow-d); border-radius:16px; padding:12px 16px; margin-bottom:16px; font-weight:600; }
  .err{ color:var(--coral); font-weight:700; min-height:1.4em; font-size:.88rem; }
  .ok{ color:var(--mint-d); font-weight:800; }

  .tabs{ display:inline-grid; grid-auto-flow:column; gap:4px; background:#F2EBE0; padding:5px; border-radius:18px; margin-bottom:16px; }
  .tab{ display:flex; align-items:center; gap:8px; border-radius:14px; padding:10px 18px; font-weight:800; color:var(--ink-soft); transition:background .15s, color .15s; }
  .tab svg{ width:18px; height:18px; }
  .tab .n{ font-size:.78rem; font-weight:900; background:rgba(255,255,255,.7); border-radius:999px; padding:1px 9px; }
  .tab[aria-selected="true"]{ background:#fff; color:var(--blue-d); box-shadow:var(--shadow-sm); }
  .tab[aria-selected="true"] .n{ background:var(--blue-soft); }
  .tab[data-mode="qa"][aria-selected="true"]{ color:var(--lav-d); }
  .tab[data-mode="qa"][aria-selected="true"] .n{ background:var(--lav-soft); }

  /* 등록 방법 탭 — 위쪽 연습 종류 탭과 헷갈리지 않게 밑줄 모양 */
  .subtabs{ display:flex; gap:22px; border-bottom:2px solid var(--line); margin:-4px 0 6px; }
  .subtab{ display:flex; align-items:center; gap:7px; padding:6px 2px 12px; margin-bottom:-2px; border-bottom:3px solid transparent;
    font-weight:800; font-size:.98rem; color:var(--ink-soft); transition:color .15s, border-color .15s; white-space:nowrap; }
  .subtab svg{ width:17px; height:17px; }
  .subtab:hover{ color:var(--ink-2); }
  .subtab[aria-selected="true"]{ color:var(--blue-d); border-bottom-color:var(--blue); }
  .add-card .foot{ padding-top:14px; }
  .add-card textarea#bulkText{ min-height:170px; }
  label.f{ display:block; font-size:.82rem; font-weight:800; color:var(--ink-soft); margin:14px 0 6px; }
  .check{ display:inline-flex; align-items:center; gap:6px; font-size:.86rem; color:var(--ink-2); font-weight:600; cursor:pointer; }

  .listbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .count{ display:inline-block; font-weight:900; color:var(--blue-d); background:var(--blue-soft); border-radius:999px; padding:0 10px; font-size:.9rem; }
  .search{ position:relative; }
  .search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-soft); }
  .search input{ padding-left:40px; }
  .status{ min-height:1.3em; margin:8px 2px 4px; font-weight:700; color:var(--mint-d); font-size:.88rem; }

  table{ width:100%; border-collapse:separate; border-spacing:0; }
  th,td{ text-align:left; padding:12px 8px; border-top:1px solid var(--line); vertical-align:top; }
  th{ font-size:.76rem; color:var(--ink-soft); font-weight:900; border-top:none; text-transform:uppercase; letter-spacing:.02em; padding-top:4px; }
  tbody tr{ transition:background .12s; }
  tbody tr:hover td{ background:#FCF9F4; }
  td:first-child{ border-radius:12px 0 0 12px; } td:last-child{ border-radius:0 12px 12px 0; }
  td.num{ color:var(--ink-soft); width:52px; font-weight:700; font-size:.88rem; padding-top:14px; }
  td.act{ width:136px; white-space:nowrap; text-align:right; }
  td.chk, th.chk{ width:34px; padding-top:14px; }
  td .p{ font-size:1rem; font-weight:700; }
  td .ans{ display:inline-block; background:var(--lav-soft); color:var(--lav-d); border-radius:8px; padding:1px 9px; margin:6px 4px 0 0; font-size:.84rem; font-weight:700; }
  .empty-row td{ text-align:center; padding:36px 8px; color:var(--ink-soft); font-weight:700; }
  code{ background:var(--blue-soft); color:var(--blue-d); border-radius:6px; padding:1px 6px; font-size:.84rem; font-family:inherit; font-weight:700; }

  @media (max-width:600px){
    .wrap{ padding:18px 14px 48px; }
    .card{ padding:18px 16px; }
    .tabs{ display:grid; grid-template-columns:1fr 1fr; width:100%; }
    .tab{ justify-content:center; padding:10px 6px; white-space:nowrap; font-size:.9rem; gap:6px; }
    .tab svg{ display:none; }
    .subtabs{ gap:14px; }
    .subtab{ font-size:.9rem; }
    .subtab svg{ display:none; }
    .brand .logo{ width:40px; height:40px; border-radius:13px; }
    h1{ font-size:1.15rem; }
    td.num, th.num{ display:none; }
    td.act{ width:auto; }
    td.act .btn{ display:flex; width:100%; margin-bottom:6px; }
    header .row{ width:100%; flex-wrap:nowrap; }
    header .row .btn{ flex:1; min-height:40px; font-size:.86rem; padding:8px 10px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M3 15v-3a9 9 0 0 1 18 0v3"/><path d="M3 15a2 2 0 0 1 2-2h1.5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2z"/><path d="M21 15a2 2 0 0 0-2-2h-1.5a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1H19a2 2 0 0 0 2-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20.5 11.5a8 8 0 0 1-11.7 7.1L4 19.8l1.2-4.4a8 8 0 1 1 15.3-3.9z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>

</svg>
<div class="wrap">

  <section id="adminView">
    <header>
      <div class="brand">
        <span class="logo" aria-hidden="true"><svg class="i"><use href="#i-gear"/></svg></span>
        <div><h1>문제 설정</h1><p>이 기기·이 브라우저에만 저장돼요</p></div>
      </div>
      <div class="row">
        <a class="btn white" href="/typing"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg>연습하러 가기</a>
      </div>
    </header>
    <p class="warn hidden" id="storageWarn"></p>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-mode="dictation" aria-selected="true"><svg class="i" aria-hidden="true"><use href="#i-headphones"/></svg>받아쓰기 <span class="n" id="n-dictation">0</span></button>
      <button class="tab" role="tab" data-mode="qa" aria-selected="false"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg>질문에 답하기 <span class="n" id="n-qa">0</span></button>
    </div>

    <div class="card add-card">
      <div class="subtabs" role="tablist" aria-label="등록 방법">
        <button type="button" class="subtab" role="tab" id="tabOne" aria-controls="paneOne" aria-selected="true"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>한 문제 등록</button>
        <button type="button" class="subtab" role="tab" id="tabBulk" aria-controls="paneBulk" aria-selected="false"><svg class="i" aria-hidden="true"><use href="#i-stack"/></svg>여러 문제 등록</button>
      </div>

      <div class="pane" id="paneOne" role="tabpanel" aria-labelledby="tabOne">
        <form id="addForm">
          <label class="f" for="addPrompt" id="addPromptLabel">문장</label>
          <input type="text" id="addPrompt" maxlength="200" autocomplete="off">
          <div id="addAnswersWrap" class="hidden">
            <label class="f" for="addAnswers">허용 정답 <span class="note" style="font-weight:600">· 여러 개면 줄을 바꾸거나 | 로 구분</span></label>
            <textarea id="addAnswers" style="min-height:84px" placeholder="서울&#10;서울특별시"></textarea>
          </div>
          <div class="row foot">
            <button class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>등록</button>
            <span id="addMsg" class="note"></span>
          </div>
        </form>
      </div>

      <div class="pane hidden" id="paneBulk" role="tabpanel" aria-labelledby="tabBulk">
        <p class="note" id="bulkHelp"></p>
        <textarea id="bulkText" style="margin-top:10px"></textarea>
        <div class="row foot" style="justify-content:space-between">
          <label class="check"><input type="checkbox" id="bulkSkip" checked> 이미 있는 문제는 건너뛰기</label>
          <button class="btn primary" id="bulkBtn"><svg class="i" aria-hidden="true"><use href="#i-stack"/></svg>일괄 등록</button>
        </div>
        <p id="bulkMsg" class="note" style="margin-top:6px"></p>
      </div>
    </div>

    <div class="card">
      <div class="listbar">
        <h2><svg class="i" aria-hidden="true"><use href="#i-list"/></svg>문제 목록 <span class="count" id="listCount">0</span></h2>
      </div>
      <div class="row">
        <div class="search grow"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="search" placeholder="문장·질문·정답에서 찾기"></div>
        <button class="btn danger" id="delSelected" disabled>선택 삭제</button>
      </div>
      <p id="listMsg" class="status"></p>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th class="chk"><input type="checkbox" id="checkAll" aria-label="모두 선택"></th><th class="num">번호</th><th id="thPrompt">문장</th><th></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

  </section>
</div>

<script src="/typing/store.js?v=3"></script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let mode = "dictation";
  let items = [];
  const selected = new Set();
  let editing = 0;

  /* 문제는 이 기기·이 브라우저에만 저장한다 (store.js). 서버로는 아무것도 보내지 않는다 */
  const T = window.TypingStore;
  const store = T.store;

  function boot() {
    const w = $("storageWarn");
    const msg = store.persistent() ? "" : "⚠️ 이 브라우저는 저장 공간을 쓸 수 없어요(사생활 보호 모드 등). 넣은 문제가 창을 닫으면 사라져요.";
    w.textContent = msg;
    w.classList.toggle("hidden", !msg);
    refreshCounts();
    setMode(mode);
  }

  function refreshCounts() {
    const c = store.counts();
    $("n-dictation").textContent = c.dictation;
    $("n-qa").textContent = c.qa;
  }
  /* 다른 탭에서 바꾸면 이 화면도 맞춘다 */
  window.addEventListener("storage", e => { if (e.key === T.KEY && !editing) { refreshCounts(); load(); } });

  /* ---------- 등록 방법 탭 ---------- */
  function setPane(which) {
    const one = which === "one";
    $("tabOne").setAttribute("aria-selected", String(one));
    $("tabBulk").setAttribute("aria-selected", String(!one));
    $("paneOne").classList.toggle("hidden", !one);
    $("paneBulk").classList.toggle("hidden", one);
    (one ? $("addPrompt") : $("bulkText")).focus();
  }
  $("tabOne").addEventListener("click", () => setPane("one"));
  $("tabBulk").addEventListener("click", () => setPane("bulk"));
  /* 왼쪽·오른쪽 화살표로도 옮겨 다닌다 */
  document.querySelector(".subtabs").addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const b = $("tabOne").getAttribute("aria-selected") === "true"; setPane(b ? "bulk" : "one"); (b ? $("tabBulk") : $("tabOne")).focus(); }
  });

  /* ---------- 탭 ---------- */
  function setMode(m) {
    mode = m;
    editing = 0;
    selected.clear();
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.mode === m)));
    const qa = m === "qa";
    $("addPromptLabel").textContent = qa ? "질문" : "문장 (단어 또는 문장)";
    $("addPrompt").placeholder = qa ? "우리나라의 수도는?" : "오늘은 날씨가 좋아요.";
    $("addAnswersWrap").classList.toggle("hidden", !qa);
    $("thPrompt").textContent = qa ? "질문 / 허용 정답" : "문장";
    $("bulkHelp").innerHTML = qa
      ? "한 줄에 한 문제. <code>질문 | 정답 | 다른 정답</code> 처럼 | 로 나눕니다 (엑셀에서 붙여 넣은 탭도 됩니다)."
      : "한 줄에 한 문제씩 적습니다. 빈 줄은 건너뜁니다.";
    $("bulkText").placeholder = qa ? "우리나라의 수도는? | 서울 | 서울특별시\n학교 이름은? | 창인학교" : "오늘은 날씨가 좋아요.\n나무\n학교에 가요.";
    $("bulkMsg").textContent = "";
    $("addMsg").textContent = "";
    $("listMsg").textContent = "";
    items = [];
    load();
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setMode(t.dataset.mode)));

  /* listMsg 는 삭제 결과를 알려 주는 자리라 여기서 지우지 않는다 */
  function load() {
    items = store.list(mode);
    render();
  }

  function splitAnswers(s) {
    return String(s || "").split(/\r?\n|\|/).map(x => x.trim()).filter(Boolean);
  }

  /* ---------- 목록 ---------- */
  function render() {
    const q = $("search").value.trim().normalize("NFC").toLowerCase();
    const shown = items.filter(x => !q || (x.prompt + " " + x.answers.join(" ")).toLowerCase().includes(q));
    $("listCount").textContent = (q ? shown.length + " / " + items.length : items.length) + "개";
    $("n-" + mode).textContent = items.length;
    const qa = mode === "qa";
    $("tbody").innerHTML = shown.map((x, k) => {
      if (x.id === editing) {
        return "<tr data-id='" + x.id + "' class='editing'><td class='chk'></td><td class='num'>" + (k + 1) + "</td><td>" +
          "<input type='text' class='e-prompt' maxlength='200' value='" + esc(x.prompt) + "'>" +
          (qa ? "<textarea class='e-answers' style='min-height:64px;margin-top:6px' placeholder='정답 (줄바꿈 또는 | 로 구분)'>" + esc(x.answers.join("\n")) + "</textarea>" : "") +
          "<div class='err e-err'></div></td><td class='act'><button class='btn small primary' data-act='save'>저장</button> <button class='btn small ghost' data-act='cancel'>취소</button></td></tr>";
      }
      return "<tr data-id='" + x.id + "'><td class='chk'><input type='checkbox' data-act='pick'" + (selected.has(x.id) ? " checked" : "") + " aria-label='선택'></td>" +
        "<td class='num'>" + (k + 1) + "</td><td><div class='p'>" + esc(x.prompt) + "</div>" +
        (qa ? "<div>" + x.answers.map(a => "<span class='ans'>" + esc(a) + "</span>").join("") + "</div>" : "") +
        "</td><td class='act'><button class='btn small' data-act='edit'>수정</button> <button class='btn small danger' data-act='del'>삭제</button></td></tr>";
    }).join("") || "<tr class='empty-row'><td colspan='4'>" + (q ? "찾는 문제가 없어요." : "아직 등록된 문제가 없어요. 위에서 첫 문제를 넣어 보세요.") + "</td></tr>";
    $("delSelected").disabled = !selected.size;
    $("delSelected").textContent = selected.size ? "선택 삭제 (" + selected.size + "개)" : "선택 삭제";
    $("checkAll").checked = shown.length > 0 && shown.every(x => selected.has(x.id));
    const ep = document.querySelector(".e-prompt");
    if (ep) ep.focus();
  }
  $("search").addEventListener("input", render);

  $("tbody").addEventListener("click", async e => {
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const tr = btn.closest("tr");
    const id = Number(tr.dataset.id);
    const item = items.find(x => x.id === id);
    const act = btn.dataset.act;
    if (act === "pick") { btn.checked ? selected.add(id) : selected.delete(id); render(); return; }
    if (act === "edit") { editing = id; render(); return; }
    if (act === "cancel") { editing = 0; render(); return; }
    if (act === "save") {
      const body = { prompt: tr.querySelector(".e-prompt").value, answers: mode === "qa" ? splitAnswers(tr.querySelector(".e-answers").value) : [] };
      try {
        Object.assign(item, store.update(id, body));
        editing = 0;
        render();
      } catch (err) { tr.querySelector(".e-err").textContent = err.message; }
      return;
    }
    if (act === "del") {
      if (!confirm("이 문제를 지울까요?\n\n" + item.prompt + "\n\n지운 문제는 되돌릴 수 없습니다.")) return;
      try {
        store.remove([id]);
        items = items.filter(x => x.id !== id);
        selected.delete(id);
        render();
      } catch (err) { alert(err.message); load(); }
    }
  });
  $("tbody").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList.contains("e-prompt")) { e.preventDefault(); e.target.closest("tr").querySelector("[data-act=save]").click(); }
    if (e.key === "Escape") { editing = 0; render(); }
  });
  $("checkAll").addEventListener("change", e => {
    const q = $("search").value.trim().normalize("NFC").toLowerCase();
    for (const x of items) if (!q || (x.prompt + " " + x.answers.join(" ")).toLowerCase().includes(q)) e.target.checked ? selected.add(x.id) : selected.delete(x.id);
    render();
  });
  $("delSelected").addEventListener("click", async () => {
    if (!selected.size || !confirm("선택한 " + selected.size + "개 문제를 지울까요?\n지운 문제는 되돌릴 수 없습니다.")) return;
    try {
      const removed = store.remove([...selected]);
      $("listMsg").textContent = removed + "개를 지웠습니다.";
      selected.clear();
      load();
    } catch (err) { alert(err.message); }
  });

  /* ---------- 등록 ---------- */
  async function addItems(list, skipDuplicates) {
    const r = store.add(mode, list, skipDuplicates);
    load();
    return r;
  }
  $("addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const m = $("addMsg");
    m.className = "note";
    const prompt = $("addPrompt").value.trim();
    const answers = splitAnswers($("addAnswers").value);
    if (!prompt) { m.textContent = mode === "qa" ? "질문을 입력하세요." : "문장을 입력하세요."; return; }
    if (mode === "qa" && !answers.length) { m.textContent = "정답을 하나 이상 입력하세요."; return; }
    try {
      const r = await addItems([{ prompt, answers }], true);
      if (r.added) { m.className = "ok"; m.textContent = "등록했습니다."; $("addPrompt").value = ""; $("addAnswers").value = ""; $("addPrompt").focus(); }
      else { m.textContent = "이미 같은 문제가 있습니다."; }
    } catch (err) { m.textContent = err.message; }
  });

  function parseBulk(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (mode === "dictation") return { list: lines.map(l => ({ prompt: l, answers: [] })), bad: [] };
    const list = [], bad = [];
    lines.forEach((l, k) => {
      const parts = l.split(l.includes("\t") ? "\t" : "|").map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) bad.push(k + 1);
      else list.push({ prompt: parts[0], answers: parts.slice(1).flatMap(splitAnswers) });
    });
    return { list, bad };
  }
  $("bulkBtn").addEventListener("click", async () => {
    const m = $("bulkMsg");
    const { list, bad } = parseBulk($("bulkText").value);
    if (bad.length) { m.className = "err"; m.textContent = bad.slice(0, 10).join(", ") + "번째 줄에 정답이 없습니다. '질문 | 정답' 형식으로 적어 주세요."; return; }
    if (!list.length) { m.className = "err"; m.textContent = "등록할 내용이 없습니다."; return; }
    if (!confirm(list.length + "개 문제를 등록할까요?")) return;
    try {
      const r = await addItems(list, $("bulkSkip").checked);
      m.className = "ok";
      m.textContent = r.added + "개 등록" + (r.skipped ? " · 이미 있는 " + r.skipped + "개는 건너뜀" : "") + ".";
      $("bulkText").value = "";
    } catch (err) { m.className = "err"; m.textContent = err.message; }
  });

  boot();
})();
</script>
</body>
</html>
