<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>보호자 로그인 | 하루랑</title>
<link rel="stylesheet" href="/haru/brand.css?v=1">
<style>
body { font: 1rem system-ui,sans-serif; color:#26362c; background:#fff8e9; padding:1rem; }
main { max-width:28rem; margin:3rem auto; }
form { display:grid; gap:.75rem; margin-bottom:1rem; }
input, button { font:inherit; padding:.75rem; }
</style>
<script defer src="/typing/login.js?v=1"></script>
</head>
<body><main>
<h1>보호자 로그인</h1>
<form id="guardianLogin">
<label for="password">보호자 비밀번호</label>
<input type="password" id="password" autocomplete="current-password" required>
<button type="submit">로그인</button>
</form>
<p id="loginStatus" role="status"></p>
<a href="/haru/typing">타자 연습으로 돌아가기</a>
</main></body>
</html>
